/* ===== tokens/fonts.css ===== */
/* ============================================================
   FONTS — Masajid Hawli (مساجد حولي)
   No brand font files were provided. These are the closest
   high-quality Arabic webfonts from Google Fonts:
     - Cairo  → display / headings (geometric, friendly, strong)
     - Tajawal → body / UI (clean, neutral, excellent at small sizes)
   The accent role uses Arial (system font, per brand request).
   Loaded via Google Fonts CDN. SUBSTITUTION — flag to client if a
   licensed brand typeface exists.
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&display=swap');

/* --- IBM Plex Mono — placeholder declaration ---
   User needs to upload the font file to replace this.
   Until then, browsers will use the fallback stack. */
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: local('IBM Plex Mono'), local('IBMPlexMono-Regular');
}
@font-face {
  font-family: 'IBM Plex Mono';
  font-style: normal;
  font-weight: 600;
  font-display: swap;
  src: local('IBM Plex Mono'), local('IBMPlexMono-SemiBold');
}

/* ===== tokens/colors.css ===== */
/* ============================================================
   COLORS — Masajid Hawli
   Derived from the brand mark: terracotta orange (#C0702F) with
   deep maroon shadow (#5A1A14) and warm amber highlights.
   Neutrals carry a warm (slightly orange) tint to harmonize.
   ============================================================ */

:root {
  /* --- Brand: Terracotta (primary) --- */
  --terracotta-50:  #FBF2EA;
  --terracotta-100: #F6E1CD;
  --terracotta-200: #ECC298;
  --terracotta-300: #E0A26C;
  --terracotta-400: #D4854A;
  --terracotta-500: #C0702F; /* brand primary */
  --terracotta-600: #A85B23;
  --terracotta-700: #8A481C;
  --terracotta-800: #6B3817;
  --terracotta-900: #4E2913;

  /* --- Brand: Maroon (deep accent, from logo shadow) --- */
  --maroon-50:  #F8EDEB;
  --maroon-100: #EFD2CD;
  --maroon-300: #B5645A;
  --maroon-500: #7E2B22;
  --maroon-700: #5A1A14; /* deep brand maroon */
  --maroon-900: #3A0F0B;

  /* --- Brand: Amber (warm highlight / gilt) --- */
  --amber-300: #F4C77E;
  --amber-400: #EDB35A;
  --amber-500: #E29A3C;

  /* --- Warm neutrals (sand → ink) --- */
  --sand-0:   #FFFFFF;
  --sand-50:  #FBF8F4; /* app background */
  --sand-100: #F4EEE6;
  --sand-200: #E9E0D4;
  --sand-300: #D8CBBA;
  --sand-400: #B8A892;
  --sand-500: #8F7E69;
  --sand-600: #6B5C49;
  --sand-700: #4D4233;
  --sand-800: #332B20;
  --sand-900: #1F1A12; /* warm ink */

  /* --- Semantic (warm-tuned) --- */
  --green-50:  #ECF6EE;
  --green-500: #2E8B57; /* success — sea green, reads well RTL */
  --green-600: #277A4B;
  --green-700: #1F6B40;

  --gold-50:   #FBF3DF;
  --gold-500:  #C99700; /* warning */
  --gold-700:  #9A7400;

  --red-50:    #FBECEA;
  --red-500:   #C0392B; /* danger */
  --red-600:   #AC3023;
  --red-700:   #97271B;

  --blue-50:   #EAF1F9;
  --blue-100:  #CFE0F1;
  --blue-200:  #A6C6E6;
  --blue-300:  #76A6D6;
  --blue-400:  #4A85C4;
  --blue-500:  #2B6CB0; /* info / links */
  --blue-600:  #225A97;
  --blue-700:  #1F4E80;
  --blue-800:  #183C63;
  --blue-900:  #122B47;

  /* ============================================================
     SEMANTIC ALIASES — use these in components, not raw scales
     ============================================================ */

  /* Surfaces & backgrounds */
  --surface-app:        var(--sand-50);
  --surface-card:       var(--sand-0);
  --surface-sunken:     var(--sand-100);
  --surface-raised:     var(--sand-0);
  --surface-inverse:    var(--maroon-700);
  --surface-brand:      var(--blue-500);
  --surface-brand-soft: var(--blue-50);

  /* Text */
  --text-strong:   var(--sand-900);
  --text-body:     var(--sand-800);
  --text-muted:    var(--sand-600);
  --text-subtle:   var(--sand-500);
  --text-on-brand: #FFFFFF;
  --text-on-dark:  var(--sand-100);
  --text-brand:    var(--blue-700);
  --text-link:     var(--blue-500);

  /* Borders & dividers */
  --border-subtle: var(--sand-200);
  --border-default:var(--sand-300);
  --border-strong: var(--sand-400);
  --border-brand:  var(--blue-500);
  --ring-focus:    var(--blue-400);

  /* Interactive brand states */
  --brand:         var(--blue-500);
  --brand-hover:   var(--blue-600);
  --brand-active:  var(--blue-700);

  /* Status surfaces / text */
  --status-success-fg: var(--green-700);
  --status-success-bg: var(--green-50);
  --status-warning-fg: var(--gold-700);
  --status-warning-bg: var(--gold-50);
  --status-danger-fg:  var(--red-700);
  --status-danger-bg:  var(--red-50);
  --status-info-fg:    var(--blue-700);
  --status-info-bg:    var(--blue-50);
}

/* ===== tokens/typography.css ===== */
/* ============================================================
   TYPOGRAPHY — Masajid Hawli
   RTL-first Arabic system. Cairo for display, Tajawal for UI/body,
   Amiri for ceremonial / Qur'anic accents.
   ============================================================ */

:root {
  /* Families */
  --font-display: 'Cairo', system-ui, sans-serif;
  --font-body:    'Tajawal', system-ui, sans-serif;
  --font-accent:  Arial, 'Segoe UI', Tahoma, sans-serif; /* accent — Arial (per brand request) */
  --font-mono:    'IBM Plex Mono', ui-monospace, monospace;

  /* Type scale (rem, 16px base) */
  --text-2xs: 0.6875rem; /* 11px */
  --text-xs:  0.75rem;   /* 12px */
  --text-sm:  0.8125rem; /* 13px */
  --text-md:  0.9375rem; /* 15px — base UI */
  --text-lg:  1.0625rem; /* 17px */
  --text-xl:  1.25rem;   /* 20px */
  --text-2xl: 1.5rem;    /* 24px */
  --text-3xl: 1.875rem;  /* 30px */
  --text-4xl: 2.375rem;  /* 38px */
  --text-5xl: 3rem;      /* 48px */

  /* Weights */
  --fw-light:    300; /* @kind font */
  --fw-regular:  400; /* @kind font */
  --fw-medium:   500; /* @kind font */
  --fw-semibold: 600; /* @kind font */
  --fw-bold:     700; /* @kind font */
  --fw-extra:    800; /* @kind font */
  --fw-black:    900; /* @kind font */

  /* Line heights — Arabic needs a touch more room */
  --lh-tight:   1.25; /* @kind font */
  --lh-snug:    1.4; /* @kind font */
  --lh-normal:  1.6; /* @kind font */
  --lh-relaxed: 1.85; /* @kind font */

  /* Letter spacing (Arabic generally none; for Latin caps labels only) */
  --tracking-label: 0.02em; /* @kind font */
}

/* ===== tokens/spacing.css ===== */
/* ============================================================
   SPACING, RADII, SHADOWS, MOTION, LAYOUT — Masajid Hawli
   ============================================================ */

:root {
  /* Spacing scale (4px base) */
  --space-0:  0;
  --space-1:  0.25rem;  /* 4 */
  --space-2:  0.5rem;   /* 8 */
  --space-3:  0.75rem;  /* 12 */
  --space-4:  1rem;     /* 16 */
  --space-5:  1.25rem;  /* 20 */
  --space-6:  1.5rem;   /* 24 */
  --space-8:  2rem;     /* 32 */
  --space-10: 2.5rem;   /* 40 */
  --space-12: 3rem;     /* 48 */
  --space-16: 4rem;     /* 64 */

  /* Radii — soft, slightly arched to echo the mosque arch motif */
  --radius-xs:   4px;
  --radius-sm:   6px;
  --radius-md:   10px;
  --radius-lg:   14px;
  --radius-xl:   20px;
  --radius-pill: 999px;

  /* Shadows — warm-tinted (never neutral black) */
  --shadow-xs:  0 1px 2px rgba(78, 41, 19, 0.06);
  --shadow-sm:  0 1px 3px rgba(78, 41, 19, 0.08), 0 1px 2px rgba(78, 41, 19, 0.06);
  --shadow-md:  0 4px 12px rgba(78, 41, 19, 0.10), 0 2px 4px rgba(78, 41, 19, 0.06);
  --shadow-lg:  0 12px 28px rgba(78, 41, 19, 0.14), 0 4px 8px rgba(78, 41, 19, 0.07);
  --shadow-brand: 0 6px 18px rgba(43, 108, 176, 0.32);

  /* Motion */
  --ease-out:   cubic-bezier(0.22, 1, 0.36, 1); /* @kind other */
  --ease-inout: cubic-bezier(0.65, 0, 0.35, 1); /* @kind other */
  --dur-fast:   120ms; /* @kind other */
  --dur-base:   200ms; /* @kind other */
  --dur-slow:   320ms; /* @kind other */

  /* Layout */
  --sidebar-w:   264px; /* @kind other */
  --topbar-h:    64px; /* @kind other */
  --container:   1280px; /* @kind other */
  --focus-width: 3px; /* @kind other */
}

/* ===== tokens/base.css ===== */
/* ============================================================
   BASE — global resets & RTL defaults for Masajid Hawli
   ============================================================ */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  direction: rtl;
  text-align: right;
  font-family: var(--font-body);
  font-size: var(--text-md);
  line-height: var(--lh-normal);
  font-weight: var(--fw-regular);
  color: var(--text-body);
  background: var(--surface-app);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: "kern" 1;
}

h1, h2, h3, h4, h5 {
  font-family: var(--font-display);
  color: var(--text-strong);
  line-height: var(--lh-tight);
  font-weight: var(--fw-bold);
  margin: 0;
}

p { margin: 0; text-wrap: pretty; }

a { color: var(--text-link); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Western Arabic numerals stay tabular in data contexts */
.tabular { font-variant-numeric: tabular-nums; }

/* Ceremonial accent helper */
.accent { font-family: var(--font-accent); }

::selection { background: var(--blue-100); color: var(--blue-900); }

:focus-visible {
  outline: var(--focus-width) solid var(--ring-focus);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

html,body{margin:0;min-height:100vh;background:var(--surface-app);}
</style>

    { username: "manager", password: "manager123", name: "رئيس القسم",     role: "section_manager" },
    { username: "saad",    password: "saad123",    name: "سعد القحطاني",   role: "employee" },
    { username: "noura",   password: "noura123",   name: "نورة سالم",      role: "employee" }
  ],

  /* رابط قاعدة بيانات Firebase الافتراضي (اختياري).
     مدمج هنا → المزامنة تعمل تلقائياً على كل الأجهزة دون لصق الرابط. */
  defaultFirebaseDbUrl: "https://masajid-hawlii-default-rtdb.europe-west1.firebasedatabase.app"
};

/* مفتاح حفظ رابط المزامنة على الجهاز */
window.SYNC_URL_KEY = 'mh_sync_db_url';

/* الرابط الفعّال للمزامنة: ما يحفظه المستخدم داخل البرنامج، وإلا الافتراضي */
window.getSyncUrl = function () {
  try {
    var saved = localStorage.getItem(window.SYNC_URL_KEY);
    if (saved && saved.trim()) return saved.trim().replace(/\/$/, '');
  } catch (_) {}
  var d = (window.APP_CONFIG.defaultFirebaseDbUrl || '').trim();
  return d ? d.replace(/\/$/, '') : '';
};

/* هل المزامنة مفعّلة (يوجد رابط Firebase)؟ */
window.isSyncEnabled = function () { return !!window.getSyncUrl(); };

<script>
/* ------------------------------------------------------------------
   طبقة البيانات — وضعان:
   1) مزامنة (Firebase): إذا ضبط المستخدم رابط قاعدة بيانات Firebase،
      تذهب الطلبات مباشرة إلى Firebase REST → البيانات مشتركة بين كل الأجهزة.
   2) محلي (بدون إنترنت): إذا لم يوجد رابط، نعترض الطلبات ونخدمها من
      localStorage مع بيانات تجريبية — يعمل البرنامج كاملاً بلا إنترنت.

   الشاشات مكتوبة على نمط Firebase RTDB REST
   (GET/POST/PATCH/DELETE على `<DB_URL>/<path>.json`)، لذا تعمل في
   الوضعين دون أي تغيير في الشاشات.
   ------------------------------------------------------------------ */
(function () {
  var MOCK_URL = 'https://local.mock/db';
  var STORE_KEY = 'mh_cultural_db_v2';

  var syncUrl = (window.getSyncUrl && window.getSyncUrl()) || '';
  var SYNC = !!syncUrl;

  // الشاشات تقرأ هذين المتغيرين
  window.FIREBASE_DB_URL = SYNC ? syncUrl : MOCK_URL;
  window.FIREBASE_API_KEY = ''; // قواعد Firebase المفتوحة لا تحتاج مفتاحاً مع REST

  function uid() {
    return '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  // ---- بيانات البداية ------------------------------------
  // يبدأ النظام فارغاً تماماً (بدون برامج تجريبية) — تُضاف البيانات الحقيقية من داخل التطبيق.
  // نُبقي فقط حسابات الدخول حتى يعمل تسجيل الدخول.
  function seedData() {
    var s = { programs: {}, halaqat: {}, imams: {}, guests: {}, lessons: { men: {}, women: {} }, users: {} };
    var add = function (node, arr) { arr.forEach(function (x) { node[uid()] = x; }); };

    var defUsers = (window.APP_CONFIG && window.APP_CONFIG.users) || [];
    add(s.users, defUsers.map(function (u) {
      return { username: u.username, password: u.password, name: u.name, role: u.role };
    }));

    return s;
  }
  window.__seedData = seedData;

  /* =========================== وضع المزامنة =========================== */
  if (SYNC) {
    // تعبئة قاعدة Firebase ببيانات تجريبية مرة واحدة إذا كانت فارغة تماماً.
    (function seedRemoteIfEmpty() {
      var flag = 'mh_seeded_' + syncUrl;
      try { if (localStorage.getItem(flag)) return; } catch (_) {}
      fetch(syncUrl + '/.json')
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (data == null) {
            return fetch(syncUrl + '/.json', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(seedData())
            });
          }
        })
        .then(function () { try { localStorage.setItem(flag, '1'); } catch (_) {} })
        .catch(function () { /* تجاهل — قد تُعبّأ لاحقاً */ });
    })();
    return; // لا نعترض fetch — الطلبات تذهب إلى Firebase الحقيقي
  }

  /* =========================== الوضع المحلي =========================== */
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        // تعبئة عقدة المستخدمين إن كانت مفقودة (تثبيتات قديمة)
        if (!parsed.users || Object.keys(parsed.users).length === 0) {
          parsed.users = seedData().users;
          save(parsed);
        }
        return parsed;
      }
    } catch (_) {}
    var fresh = seedData(); save(fresh); return fresh;
  }
  function save(s) { try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (_) {} }

  function getNode(store, parts, create) {
    var node = store;
    for (var i = 0; i < parts.length; i++) {
      var k = parts[i];
      if (node[k] == null) { if (!create) return undefined; node[k] = {}; }
      node = node[k];
    }
    return node;
  }
  function jsonResponse(data) {
    return new Response(JSON.stringify(data), { status: 200, headers: { 'Content-Type': 'application/json' } });
  }

  var nativeFetch = window.fetch ? window.fetch.bind(window) : null;

  window.fetch = function (url, opts) {
    try {
      var u = typeof url === 'string' ? url : (url && url.url) || '';
      if (u.indexOf(MOCK_URL) === 0) {
        opts = opts || {};
        var method = (opts.method || 'GET').toUpperCase();
        var path = u.slice(MOCK_URL.length).split('?')[0].replace(/\.json$/, '');
        var parts = path.split('/').filter(Boolean);
        var store = load();

        if (method === 'GET') {
          var r = getNode(store, parts, false);
          return Promise.resolve(jsonResponse(r == null ? null : r));
        }
        if (method === 'POST') {
          var coll = getNode(store, parts, true);
          var id = uid();
          coll[id] = opts.body ? JSON.parse(opts.body) : {};
          save(store);
          return Promise.resolve(jsonResponse({ name: id }));
        }
        if (method === 'PATCH' || method === 'PUT') {
          var id2 = parts.pop();
          var parent = getNode(store, parts, true);
          parent[id2] = Object.assign({}, parent[id2], opts.body ? JSON.parse(opts.body) : {});
          save(store);
          return Promise.resolve(jsonResponse(parent[id2]));
        }
        if (method === 'DELETE') {
          var id3 = parts.pop();
          var parent2 = getNode(store, parts, false);
          if (parent2) { delete parent2[id3]; save(store); }
          return Promise.resolve(jsonResponse(null));
        }
        return Promise.resolve(jsonResponse(null));
      }
    } catch (e) { return Promise.reject(e); }
    if (nativeFetch) return nativeFetch(url, opts);
    return Promise.reject(new Error('fetch unavailable'));
  };

  window.__resetCulturalDB = function () { localStorage.removeItem(STORE_KEY); location.reload(); };
})();

</script>


<script type="text/babel" data-presets="react">
/* ===== kit-ui.jsx ===== */
/* Local cosmetic mirrors of the Masajid Hawli DS primitives, exposed on window
   so the UI kit renders standalone (the compiled _ds_bundle.js only resolves
   inside the Design System tab). Styling matches components/* 1:1. */

function Icon({ n, size = 18, color, style }) {
  // مكتفٍ ذاتياً: يبني الـ SVG من بيانات lucide مباشرةً (يعمل فوراً ويتحدّث عند تغيّر الأيقونة).
  const inner = React.useMemo(() => {
    const L = window.lucide;
    if (!L || !L.icons) return '';
    const pascal = String(n || '').split(/[-_]/).filter(Boolean).map((p) => p.charAt(0).toUpperCase() + p.slice(1)).join('');
    const node = L.icons[pascal];
    if (!node) return '';
    const children = node[2] || [];
    return children.map(([tag, attrs]) => {
      const a = Object.entries(attrs || {}).map(([k, v]) => `${k}="${v}"`).join(' ');
      return `<${tag} ${a} />`;
    }).join('');
  }, [n]);
  return (
    <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none"
      stroke="currentColor" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: 'inline-block', verticalAlign: 'middle', flexShrink: 0, color, ...style }}
      dangerouslySetInnerHTML={{ __html: inner }}></svg>
  );
}

function Button({ children, variant = 'primary', size = 'md', iconStart, iconEnd, disabled, full, style, ...rest }) {
  const sizes = {
    sm: { padding: '0 14px', height: 34, fontSize: 'var(--text-sm)', gap: 6 },
    md: { padding: '0 20px', height: 42, fontSize: 'var(--text-md)', gap: 8 },
    lg: { padding: '0 24px', height: 50, fontSize: 'var(--text-lg)', gap: 10 },
  };
  const variants = {
    primary: { background: 'var(--brand)', color: '#fff', border: '1px solid transparent', boxShadow: 'var(--shadow-brand)' },
    secondary: { background: 'var(--surface-card)', color: 'var(--text-brand)', border: '1px solid var(--border-default)' },
    ghost: { background: 'transparent', color: 'var(--text-body)', border: '1px solid transparent' },
    danger: { background: 'var(--red-500)', color: '#fff', border: '1px solid transparent' },
  };
  const s = sizes[size], v = variants[variant];
  return (
    <button disabled={disabled} style={{
      display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: s.gap,
      height: s.height, padding: s.padding, width: full ? '100%' : undefined,
      fontFamily: 'var(--font-body)', fontSize: s.fontSize, fontWeight: 700, lineHeight: 1,
      borderRadius: 'var(--radius-md)', cursor: disabled ? 'not-allowed' : 'pointer',
      opacity: disabled ? 0.5 : 1, whiteSpace: 'nowrap', transition: 'filter .12s, transform .12s', ...v, ...style,
    }}
      onMouseEnter={(e) => { if (!disabled) e.currentTarget.style.filter = 'brightness(0.94)'; }}
      onMouseLeave={(e) => { e.currentTarget.style.filter = 'none'; e.currentTarget.style.transform = 'none'; }}
      onMouseDown={(e) => { if (!disabled) e.currentTarget.style.transform = 'translateY(1px)'; }}
      onMouseUp={(e) => { e.currentTarget.style.transform = 'none'; }}
      {...rest}>
      {iconStart}{children}{iconEnd}
    </button>
  );
}

function IconButton({ children, label, variant = 'ghost', size = 'md', style, ...rest }) {
  const dims = { sm: 32, md: 38, lg: 44 }[size] || 38;
  const [hov, setHov] = React.useState(false);

  };
  const v = variants[variant] || variants.ghost;
  return (
    <button aria-label={label} title={label} onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: dims, height: dims, borderRadius: 'var(--radius-md)', cursor: 'pointer', background: hov ? 'var(--surface-sunken)' : v.background, color: v.color, border: v.border, ...style }} {...rest}>
      {children}

}

function Card({ children, title, action, padding = true, style }) {

}

function Avatar({ name = '', size = 40, src, style }) {
  const initials = name.trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join('');
  const tints = [['var(--terracotta-100)', 'var(--terracotta-700)'], ['var(--maroon-100)', 'var(--maroon-700)'], ['var(--status-info-bg)', 'var(--blue-700)'], ['var(--status-success-bg)', 'var(--green-700)'], ['var(--amber-300)', 'var(--maroon-700)']];
  let h = 0; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % tints.length;
  const [bg, fg] = tints[h] || tints[0];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: size, height: size, borderRadius: '50%', flexShrink: 0, background: src ? 'transparent' : bg, color: fg, overflow: 'hidden', fontFamily: 'var(--font-display)', fontWeight: 700, fontSize: size * 0.4, ...style }}>

}

function Input({ label, hint, error, icon, style, ...rest }) {

function Select({ label, options = [], style, ...rest }) {

function Switch({ checked, onChange, label, disabled, style }) {

function StatTile({ icon, value, label, delta, tone = 'brand', style }) {
  const tones = { brand: { bg: 'var(--blue-50)', fg: 'var(--blue-600)' }, info: { bg: 'var(--status-info-bg)', fg: 'var(--blue-500)' }, success: { bg: 'var(--status-success-bg)', fg: 'var(--green-500)' }, maroon: { bg: 'var(--maroon-50)', fg: 'var(--maroon-500)' } };

Object.assign(window, { Icon, Button, IconButton, Card, Badge, Avatar, Input, Select, Switch, Tabs, SidebarItem, StatTile });

<script type="text/babel" data-presets="react">
/* ===== LoginScreen.jsx ===== */
/* شاشة الدخول — اسم المستخدم وكلمة المرور (تحقق محلي ضد قائمة المستخدمين). */
function LoginScreen({ onLogin }) {
  const [username, setUsername] = React.useState('admin');
  const [password, setPassword] = React.useState('');
  const [isLoading, setIsLoading] = React.useState(false);
  const [error, setError] = React.useState('');
  const synced = window.isSyncEnabled && window.isSyncEnabled();

  const handleLogin = async (e) => {
    e.preventDefault();
    setError('');
    if (!username.trim() || !password) { setError('يرجى إدخال اسم المستخدم وكلمة المرور.'); return; }
    setIsLoading(true);
    try {
      // اجمع المستخدمين: قاعدة البيانات (متزامنة) + الافتراضيين من الإعدادات (احتياط)
      let dbUsers = [];
      try {
        const r = await fetch(`${window.FIREBASE_DB_URL}/users.json?key=${window.FIREBASE_API_KEY}`);
        if (r.ok) {
          const data = await r.json();
          if (data) dbUsers = Object.values(data);
        }
      } catch (_) {}
      const cfgUsers = (window.APP_CONFIG && window.APP_CONFIG.users) || [];
      const byName = {};
      cfgUsers.forEach((u) => { byName[u.username.toLowerCase()] = u; });
      dbUsers.forEach((u) => { if (u && u.username) byName[u.username.toLowerCase()] = u; });
      const users = Object.values(byName);

      const u = users.find((x) => x.username && x.username.toLowerCase() === username.trim().toLowerCase() && x.password === password);
      if (!u) { setError('اسم المستخدم أو كلمة المرور غير صحيحة.'); setIsLoading(false); return; }
      if (u.disabled) { setError('هذا الحساب موقوف. تواصل مع مدير القسم لإعادة تفعيله.'); setIsLoading(false); return; }
      try { localStorage.setItem('currentUser', JSON.stringify({ username: u.username, name: u.name, role: u.role })); } catch (_) {}
      setTimeout(() => { setIsLoading(false); onLogin({ username: u.username, name: u.name, role: u.role }); }, 200);
    } catch (err) {
      setIsLoading(false);
      setError('تعذّر تسجيل الدخول. حاول مرة أخرى.');
    }
  };

  return (
    <div style={{ display: 'flex', minHeight: '100vh', fontFamily: 'var(--font-body)', flexWrap: 'wrap' }}>
      {/* لوحة الهوية (أزرق) */}
      <div style={{ position: 'relative', flex: '1 1 320px', background: 'var(--blue-600)', color: 'white', padding: 60, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', textAlign: 'center', direction: 'rtl' }}>

<script type="text/babel" data-presets="react">
/* ===== AppShell.jsx ===== */
/* Maps a program category to the matching sidebar screen. */
function catToNav(cat) {
  switch (cat) {
    case 'دروس نسائية': return 'women-lessons';
    case 'دروس رجال': return 'men-lessons';
    case 'حلقات': return 'halaqat';
    case 'جاليات': return 'communities';
    case 'إمام متطوع': return 'imams';
    case 'ضيوف من الخارج': return 'guests';
    default: return 'all';
  }
}

/* Maps a program section key to its sidebar screen. */
function navForSection(section) {
  switch (section) {
    case 'women': return 'women-lessons';
    case 'men': return 'men-lessons';
    case 'halaqat': return 'halaqat';
    case 'communities': return 'communities';
    case 'imam': return 'imams';
    case 'guests': return 'guests';
    default: return 'all';
  }
}

/* Builds the notification feed — new programs awaiting the manager's approval. */
function buildNotifications(pending, isManager) {
  const list = [];
  if (isManager && Array.isArray(pending)) {
    pending.forEach((p) => {
      list.push({
        id: 'pending-' + p.id,
        icon: 'clock',
        tone: 'warning',
        title: 'برنامج جديد بانتظار الاعتماد',
        body: p.name + (p.mosque ? ' — ' + p.mosque : (p.sectionLabel ? ' — ' + p.sectionLabel : '')),
        time: 'بحاجة لاعتماد',
        nav: navForSection(p.section),
      });
    });
  }
  return list;
}

const NOTIF_TONE = {
  warning: { bg: 'var(--amber-100, #FBEBD3)', fg: 'var(--amber-600, #B0701F)' },
  danger: { bg: 'var(--terracotta-100, #F5DDCB)', fg: 'var(--maroon-700, #5A1A14)' },
  info: { bg: 'var(--blue-50, #E7F0FA)', fg: 'var(--blue-500, #2B6CB0)' },
  neutral: { bg: 'var(--surface-sunken)', fg: 'var(--text-muted)' },
};

function NotificationsBell({ onNav, pending, isManager }) {
  const { Icon } = window;
  const notifs = React.useMemo(() => buildNotifications(pending, isManager), [pending, isManager]);
  const [open, setOpen] = React.useState(false);
  const [readIds, setReadIds] = React.useState(() => {
    try { return JSON.parse(localStorage.getItem('mh_read_notifs') || '[]'); } catch (e) { return []; }
  });
  const ref = React.useRef(null);

  const persist = (ids) => {
    setReadIds(ids);
    try { localStorage.setItem('mh_read_notifs', JSON.stringify(ids)); } catch (e) {}
  };
  const unread = notifs.filter((n) => !readIds.includes(n.id));
  const markAll = () => persist(notifs.map((n) => n.id));
  const openItem = (n) => {
    if (!readIds.includes(n.id)) persist([...readIds, n.id]);
    setOpen(false);
    if (n.nav && onNav) onNav(n.nav);
  };

  React.useEffect(() => {
    if (!open) return undefined;
    const onDoc = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    const onEsc = (e) => { if (e.key === 'Escape') setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    document.addEventListener('keydown', onEsc);
    return () => { document.removeEventListener('mousedown', onDoc); document.removeEventListener('keydown', onEsc); };
  }, [open]);

  return (
    <div ref={ref} style={{ position: 'relative' }}>
      <button onClick={() => setOpen((v) => !v)} aria-label="التنبيهات" style={{ position: 'relative', width: 40, height: 40, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: open ? 'var(--surface-sunken)' : 'transparent', border: 'none', borderRadius: 'var(--radius-md)', cursor: 'pointer', color: open ? 'var(--brand)' : 'var(--text-muted)', transition: 'background 140ms var(--ease-out, ease-out), color 140ms var(--ease-out, ease-out)' }}>
        <Icon n="bell" size={20} />
        {unread.length > 0 && (
          <span style={{ position: 'absolute', top: 4, insetInlineEnd: 4, minWidth: 16, height: 16, padding: '0 4px', boxSizing: 'border-box', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: 'var(--brand)', color: '#fff', fontFamily: 'var(--font-body)', fontSize: 10, fontWeight: 700, lineHeight: 1, borderRadius: 999, border: '2px solid var(--surface-card)' }}>{unread.length}</span>
        )}
      </button>

      {open && (
        <div style={{ position: 'absolute', insetInlineEnd: 0, top: 'calc(100% + 10px)', width: 360, maxWidth: '90vw', background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-lg, 0 12px 32px rgba(78,41,19,.18))', zIndex: 50, overflow: 'hidden' }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 16px', borderBottom: '1px solid var(--border-subtle)' }}>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-md)', fontWeight: 800, color: 'var(--text-strong)' }}>التنبيهات</div>
            {unread.length > 0 && (
              <button onClick={markAll} style={{ background: 'transparent', border: 'none', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', fontWeight: 600, color: 'var(--brand)' }}>تعليم الكل كمقروء</button>
            )}
          </div>

          <div style={{ maxHeight: 380, overflowY: 'auto' }}>
            {notifs.length === 0 && (
              <div style={{ padding: '32px 16px', textAlign: 'center', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', color: 'var(--text-subtle)' }}>لا توجد تنبيهات</div>
            )}
            {notifs.map((n) => {
              const isUnread = !readIds.includes(n.id);
              const t = NOTIF_TONE[n.tone] || NOTIF_TONE.neutral;
              return (
                <button key={n.id} onClick={() => openItem(n)} style={{ display: 'flex', gap: 12, width: '100%', textAlign: 'start', padding: '12px 16px', background: isUnread ? 'var(--blue-50, #E7F0FA)' : 'transparent', border: 'none', borderBottom: '1px solid var(--border-subtle)', cursor: 'pointer' }}>
                  <span style={{ flexShrink: 0, width: 36, height: 36, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: t.bg, color: t.fg, borderRadius: 'var(--radius-md)' }}><Icon n={n.icon} size={18} /></span>
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                      <span style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-strong)' }}>{n.title}</span>
                      {isUnread && <span style={{ flexShrink: 0, width: 7, height: 7, background: 'var(--brand)', borderRadius: '50%' }} />}
                    </span>
                    <span style={{ display: 'block', fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--text-muted)', marginTop: 2, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{n.body}</span>
                    <span style={{ display: 'block', fontFamily: 'var(--font-body)', fontSize: 'var(--text-2xs)', color: 'var(--text-subtle)', marginTop: 3 }}>{n.time}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* App shell — fixed RTL sidebar (right) + topbar. */
function AppShell({ user, role, active, onNav, onLogout, counts, pending, children }) {
  const { SidebarItem, Avatar, Icon } = window;
  const isManager = role === 'section_manager';
  const roleLabel = isManager ? 'رئيس القسم' : 'موظف';
  const displayName = (user && user.name) || 'مستخدم';

  return (
    <div style={{ display: 'flex', minHeight: '100vh', background: 'var(--surface-app)' }}>
      {/* Sidebar */}
      <aside style={{ width: 264, flexShrink: 0, background: 'var(--surface-card)', borderInlineStart: '1px solid var(--border-subtle)', display: 'flex', flexDirection: 'column', position: 'sticky', top: 0, height: '100vh' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '18px 20px', borderBottom: '1px solid var(--border-subtle)' }}>
          <img src={window.LOGO_SRC || 'assets/logo.png'} alt="مساجد حولي" style={{ height: 40 }} />
          <div>
            <div style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-md)', fontWeight: 800, color: 'var(--maroon-700)' }}>مساجد حولي</div>
            <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-2xs)', color: 'var(--text-subtle)' }}>البرامج الثقافية</div>
          </div>
        </div>

        <nav style={{ flex: 1, overflowY: 'auto', padding: '12px 12px', display: 'flex', flexDirection: 'column', gap: 3 }}>
          {window.KIT_NAV.map((n) => {
            const liveCount = (counts && counts[n.id] != null) ? counts[n.id] : n.count;
            return (
              <SidebarItem key={n.id} icon={<Icon n={n.icon} />} active={active === n.id} count={liveCount} onClick={() => onNav(n.id)}>{n.label}</SidebarItem>
            );
          })}
          {isManager && (
            <>
              <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-2xs)', fontWeight: 700, color: 'var(--text-subtle)', padding: '14px 14px 6px', letterSpacing: '.02em' }}>أدوات الإدارة</div>
              {window.KIT_ADMIN.map((n) => (
                <SidebarItem key={n.id} icon={<Icon n={n.icon} />} active={active === n.id} onClick={() => onNav(n.id)}>{n.label}</SidebarItem>
              ))}
            </>
          )}
        </nav>

        <div style={{ padding: 12, borderTop: '1px solid var(--border-subtle)' }}>
          <button onClick={onLogout} style={{ display: 'flex', alignItems: 'center', gap: 12, width: '100%', padding: '11px 14px', background: 'transparent', border: 'none', borderRadius: 'var(--radius-md)', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-md)', fontWeight: 500, color: 'var(--text-muted)' }}>
            <Icon n="log-out" /><span>تسجيل الخروج</span>
          </button>
        </div>
      </aside>

      {/* Main column */}
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
        <header style={{ height: 64, flexShrink: 0, background: 'var(--surface-card)', borderBottom: '1px solid var(--border-subtle)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 28px', position: 'sticky', top: 0, zIndex: 5 }}>
          <div style={{ position: 'relative', display: 'flex', alignItems: 'center', width: 320, maxWidth: '40vw' }}>
            <span style={{ position: 'absolute', insetInlineStart: 12, color: 'var(--text-subtle)', display: 'inline-flex' }}><Icon n="search" size={16} /></span>
            <input placeholder="ابحث عن برنامج أو مسجد…" style={{ width: '100%', height: 40, boxSizing: 'border-box', padding: '0 38px', background: 'var(--surface-sunken)', border: '1px solid transparent', borderRadius: 'var(--radius-md)', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', color: 'var(--text-strong)', outline: 'none' }} />
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
            <NotificationsBell onNav={onNav} pending={pending} isManager={isManager} />
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <Avatar name={displayName} size={38} />
              <div style={{ lineHeight: 1.3 }}>
                <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-strong)' }}>{displayName}</div>
                <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-2xs)', color: 'var(--text-subtle)' }}>{roleLabel}</div>
              </div>
            </div>
          </div>
        </header>

        <main style={{ flex: 1, padding: 28, overflowY: 'auto' }}>{children}</main>
      </div>
    </div>
  );
}
window.AppShell = AppShell;

</script>

<script type="text/babel" data-presets="react">
/* ===== DashboardScreen.jsx ===== */
/* Dashboard — KPI tiles + recent programs + category breakdown. */
function DashboardScreen({ role, onNav, liveStats }) {
  const { StatTile, Card, Badge, Avatar, Button, Icon } = window;
  const stats = liveStats || {};
  const recent = stats.recent || [];
  const fullName = (window.MH_USER && window.MH_USER.name) || 'مستخدم';
  const firstName = String(fullName).trim().split(/\s+/)[0];
  const [printOpen, setPrintOpen] = React.useState(false);
  const [printing, setPrinting] = React.useState(false);
  const [printSel, setPrintSel] = React.useState({ summary: true, distribution: true, programs: true });
  const PRINT_OPTS = [
    { key: 'summary', title: 'ملخص المؤشرات', desc: 'إجمالي البرامج، الحلقات النشطة، المستفيدون، الأئمة المتطوعون' },
    { key: 'distribution', title: 'توزيع البرامج على الأقسام', desc: 'عدد البرامج في كل قسم' },
    { key: 'programs', title: 'قائمة البرامج كاملة', desc: 'جدول بكل البرامج: القسم، المشرف، المسجد، المستفيدون، الحالة' },
  ];
  const anySel = printSel.summary || printSel.distribution || printSel.programs;
  async function doPrint() {
    if (!anySel || printing) return;
    setPrinting(true);
    try { await window.printDeptReport(printSel); } catch (_) {}
    setPrinting(false);
    setPrintOpen(false);
  }
  const cats = (stats.cats && stats.cats.length) ? stats.cats : [
    { label: 'دروس نسائية', n: 0, pct: 0, color: 'var(--terracotta-500)' },
    { label: 'دروس رجال', n: 0, pct: 0, color: 'var(--maroon-500)' },
    { label: 'حلقات', n: 0, pct: 0, color: 'var(--amber-500)' },
    { label: 'جاليات', n: 0, pct: 0, color: 'var(--blue-500)' },

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 22, maxWidth: 1180 }}>

          <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-md)', color: 'var(--text-muted)', marginTop: 4 }}>هذه نظرة عامة على برامج القسم لهذا الأسبوع.</p>
        </div>
        <div style={{ display: 'flex', gap: 10 }}>
          <Button variant="secondary" iconStart={<Icon n="printer" size={16} />} onClick={() => setPrintOpen(true)}>طباعة</Button>
          <Button iconStart={<Icon n="plus" size={16} />} onClick={() => onNav('all')}>إضافة برنامج</Button>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
        <StatTile icon={<Icon n="book-open" size={22} />} value={fmt(stats.total, '0')} label="إجمالي البرامج" tone="brand" />
        <StatTile icon={<Icon n="layers" size={22} />} value={fmt(stats.activeHalaqat, '0')} label="حلقات نشطة" tone="success" />
        <StatTile icon={<Icon n="users" size={22} />} value={fmt(stats.beneficiaries, '0')} label="المستفيدون" tone="info" />
        <StatTile icon={<Icon n="user-check" size={22} />} value={fmt(stats.imams, '0')} label="أئمة متطوعون" tone="maroon" />
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr', gap: 16 }}>
        <Card title="أحدث البرامج" padding={false} action={<Button variant="ghost" size="sm" onClick={() => onNav('all')}>عرض الكل</Button>}>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--font-body)' }}>
            <thead>
              <tr style={{ background: 'var(--surface-sunken)' }}>
                {['البرنامج', 'القسم', 'المشرف', 'المستفيدون', 'الحالة'].map((h) => (
                  <th key={h} style={{ textAlign: 'start', padding: '10px 16px', fontSize: 'var(--text-xs)', fontWeight: 700, color: 'var(--text-subtle)' }}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {recent.length === 0 && (
                <tr><td colSpan={5} style={{ padding: '28px 16px', textAlign: 'center', fontSize: 'var(--text-sm)', color: 'var(--text-subtle)' }}>لا توجد برامج بعد — ابدأ بإضافة برنامج.</td></tr>

                    <span>
                      <span style={{ display: 'block', fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-strong)' }}>{o.title}</span>

}

const SECTION_BY_ID = Object.fromEntries(PROGRAM_SECTIONS.map((s) => [s.id, s]));

/* قيم افتراضية فارغة لقسم معيّن */
function emptyFormFor(sectionId) {
  const sec = SECTION_BY_ID[sectionId] || PROGRAM_SECTIONS[0];
  const f = { section: sec.id, status: 'active' };
  sec.fields.forEach((fld) => { f[fld.key] = fld.type === 'number' ? '' : ''; });
  return f;
}

/* عرض موحّد لقيم الجدول من سجل قد يكون قديماً أو جديداً */
function rowView(item) {
  const sec = SECTION_BY_ID[item.section];
  const sectionLabel = sec
    ? (item.section === 'competitions' && item.compType ? item.compType : sec.label)
    : item.category === 'quran' ? 'حلقات قرآن'
    : item.category === 'hadith' ? 'دروس رجال'
    : item.category === 'fiqh' ? 'دروس رجال' : 'برامج عامة';
  const person = item.instructor || item.sheikhName || item.supervisor || item.organizer || item.specialty || item.phone || item.association || '—';
  const count = (item.count != null && item.count !== '') ? item.count
    : (item.beneficiaries != null ? item.beneficiaries
    : (item.studentsCount != null ? item.studentsCount : '—'));
  return { name: item.name || '—', sectionLabel, person, mosque: item.mosque || '—', count };
}

/* حالة الحلقة/البرنامج حسب الحالة اليدوية وتاريخ النهاية (التصريح) */
function statusView(item) {
  if (item.status && item.status !== 'active') return { label: 'متوقف', color: 'gray' };
  const end = item.endDate ? new Date(item.endDate + 'T00:00:00') : null;
  if (end && !isNaN(end)) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((end - today) / 86400000);
    if (days < 0) return { label: 'انتهى التصريح', color: 'red' };
    if (days <= 14) return { label: 'قرب الانتهاء', color: 'yellow' };
  }
  return { label: 'فعّالة', color: 'green' };
}

function ProgramsScreen({ role, nav }) {
  const { Card, Badge, Button, IconButton, Input, Icon } = window;
  const isManager = role === 'section_manager';

  // القسم المرتبط بعنصر القائمة المفتوح (دروس نسائية/رجال/جاليات → عرض القسم فقط)
  const NAV_TO_SECTION = { communities: 'communities', 'women-lessons': 'women', 'men-lessons': 'men', guests: 'guests', competitions: 'competitions', preachers: 'preachers' };
  const navSection = NAV_TO_SECTION[nav] || 'all';

  const [programs, setPrograms] = React.useState([]);
  const [searchQ, setSearchQ] = React.useState('');
  const [sectionFilter, setSectionFilter] = React.useState(navSection);
  const [pendingOnly, setPendingOnly] = React.useState(false);
  const [monthFilter, setMonthFilter] = React.useState('');
  const [openModal, setOpenModal] = React.useState(false);
  const [editingId, setEditingId] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState('');
  const [form, setForm] = React.useState(emptyFormFor('halaqat'));

  const DB_URL = window.FIREBASE_DB_URL;
  const API_KEY = window.FIREBASE_API_KEY;

  // قوائم قابلة للإدارة (المناطق / الجمعيات) — تُحفظ في Firebase فتصير مشتركة بين الأجهزة
  const [lists, setLists] = React.useState(() => {
    try { const c = JSON.parse(localStorage.getItem('mh_lists') || '{}');
      return { areas: (c.areas && c.areas.length) ? c.areas : HALAQAT_AREAS, associations: (c.associations && c.associations.length) ? c.associations : HALAQAT_ASSOCIATIONS };
    } catch (_) { return { areas: HALAQAT_AREAS, associations: HALAQAT_ASSOCIATIONS }; }
  });

  async function loadLists() {
    try {
      const r = await fetch(`${DB_URL}/settings.json?key=${API_KEY}`);
      if (!r.ok) return;
      const s = await r.json();
      if (!s) return;
      setLists((prev) => {
        const next = {
          areas: (Array.isArray(s.areas) && s.areas.length) ? s.areas : prev.areas,
          associations: (Array.isArray(s.associations) && s.associations.length) ? s.associations : prev.associations,
        };
        try { localStorage.setItem('mh_lists', JSON.stringify(next)); } catch (_) {}
        return next;
      });
    } catch (_) {}
  }

  function persistList(key, arr) {
    setLists((prev) => {
      const next = { ...prev, [key]: arr };
      try { localStorage.setItem('mh_lists', JSON.stringify(next)); } catch (_) {}
      return next;
    });
    try { fetch(`${DB_URL}/settings/${key}.json?key=${API_KEY}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(arr) }); } catch (_) {}
  }

  function addListItem(listKey, fieldKey, promptText) {
    const v = (window.prompt(promptText) || '').trim();
    if (!v) return;
    const cur = lists[listKey] || [];
    if (!cur.includes(v)) persistList(listKey, [...cur, v]);
    setForm((prev) => ({ ...prev, [fieldKey]: v }));
  }

  function deleteListItem(listKey, fieldKey) {
    const cur = form[fieldKey];
    if (!cur) { window.alert('اختر العنصر المراد حذفه من القائمة أولاً.'); return; }
    if (!window.confirm('حذف «' + cur + '» من القائمة نهائياً؟')) return;
    persistList(listKey, (lists[listKey] || []).filter((x) => x !== cur));
    setForm((prev) => ({ ...prev, [fieldKey]: '' }));
  }

  React.useEffect(() => { loadPrograms(); loadLists(); }, []);
  React.useEffect(() => { setSectionFilter(navSection); setMonthFilter(''); }, [navSection]);
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  async function loadPrograms() {
    try {
      setLoading(true);
      // مصدر موحّد: برامج /programs + دمج بيانات شاشات الدروس القديمة (women/men)
      const [pRes, wRes, mRes, gRes] = await Promise.all([
        fetch(`${DB_URL}/programs.json?key=${API_KEY}`),
        fetch(`${DB_URL}/lessons/women.json?key=${API_KEY}`).catch(() => null),
        fetch(`${DB_URL}/lessons/men.json?key=${API_KEY}`).catch(() => null),
        fetch(`${DB_URL}/guests.json?key=${API_KEY}`).catch(() => null),
      ]);
      if (!pRes.ok) throw new Error('Failed to fetch programs');
      const pData = await pRes.json();
      const arr = pData ? Object.entries(pData).map(([id, item]) => ({ id, ...item })) : [];
      // دمج السجلات القديمة من الشاشات المنفصلة لتظهر موحّدة (مع وسم مسار مصدرها)
      const legacy = [];
      const addLegacy = async (res, section, path) => {
        if (!res || !res.ok) return;
        let d = null; try { d = await res.json(); } catch (_) { return; }
        if (!d) return;
        Object.entries(d).forEach(([id, item]) => {
          const norm = { id, ...item, section, _legacy: path, count: (item.count != null && item.count !== '') ? item.count : item.attendees };
          if (section === 'guests' && norm.status !== 'inactive') norm.status = 'active';
          legacy.push(norm);
        });
      };
      await addLegacy(wRes, 'women', 'lessons/women');
      await addLegacy(mRes, 'men', 'lessons/men');
      await addLegacy(gRes, 'guests', 'guests');
      setPrograms([...arr, ...legacy]);
      setError('');
    } catch (err) {
      setError('فشل تحميل البرامج');
      setPrograms([]);
    } finally { setLoading(false); }
  }

  function openAdd() { const def = SECTION_BY_ID[sectionFilter] ? sectionFilter : 'halaqat'; setForm(emptyFormFor(def)); setEditingId(null); setError(''); setOpenModal(true); }

  function selectSection(id) {
    // حافظ على القيم المشتركة (الاسم/المسجد/العدد) عند تبديل القسم
    setForm((prev) => {
      const next = emptyFormFor(id);
      ['name', 'mosque', 'count', 'status'].forEach((k) => { if (prev[k] != null && prev[k] !== '') next[k] = prev[k]; });
      return next;
    });
  }

  const currentSection = SECTION_BY_ID[form.section] || PROGRAM_SECTIONS[0];

  async function handleSave() {
    const missing = currentSection.fields.filter((f) => f.required && !String(form[f.key] || '').trim());
    if (missing.length) { setError('يرجى تعبئة الحقول المطلوبة: ' + missing.map((m) => m.label).join('، ')); return; }
    try {
      setLoading(true);
      const payload = { ...form };
      delete payload._legacy;
      if (payload.count !== '' && payload.count != null) payload.count = parseInt(payload.count) || 0;
      // اعتماد: الموظف يقدّم الطلب «تحت التدقيق»، والمدير يعتمده مباشرة
      payload.approval = isManager ? 'approved' : 'pending';
      // تسجيل الموظف صاحب الإدخال لتقرير «إنجاز الموظفين»
      if (!editingId) { const u = window.MH_USER; if (u) { payload.createdBy = u.username; payload.createdByName = u.name; } }
      if (editingId && !form._legacy) {
        const r = await fetch(`${DB_URL}/programs/${editingId}.json?key=${API_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error('Update failed');
      } else {
        const r = await fetch(`${DB_URL}/programs.json?key=${API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error('Create failed');
        // سجل قديم تم تعديله: ننقله إلى /programs ونحذف الأصل القديم
        if (editingId && form._legacy) {
          try { await fetch(`${DB_URL}/${form._legacy}/${editingId}.json?key=${API_KEY}`, { method: 'DELETE' }); } catch (_) {}
        }
      }
      await loadPrograms();
      window.dispatchEvent(new Event('mh-data-changed'));
      setOpenModal(false); setEditingId(null); setError('');
    } catch (err) { setError('فشل الحفظ'); } finally { setLoading(false); }
  }

  async function handleDelete(item) {
    if (!confirm('تأكيد حذف هذا البرنامج؟')) return;
    try {
      setLoading(true);
      const path = item._legacy ? `${item._legacy}/${item.id}` : `programs/${item.id}`;
      const r = await fetch(`${DB_URL}/${path}.json?key=${API_KEY}`, { method: 'DELETE' });
      if (!r.ok) throw new Error('Delete failed');
      await loadPrograms();
      window.dispatchEvent(new Event('mh-data-changed'));
    } catch (err) { setError('فشل الحذف'); } finally { setLoading(false); }
  }

  async function handleApprove(item) {
    try {
      setLoading(true);
      const path = item._legacy ? `${item._legacy}/${item.id}` : `programs/${item.id}`;
      const r = await fetch(`${DB_URL}/${path}.json?key=${API_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ approval: 'approved' }) });
      if (!r.ok) throw new Error('Approve failed');
      await loadPrograms();
      window.dispatchEvent(new Event('mh-data-changed'));
    } catch (err) { setError('فشل الاعتماد'); } finally { setLoading(false); }
  }

  function handleEdit(item) {
    const sectionId = SECTION_BY_ID[item.section] ? item.section : 'general';
    const base = emptyFormFor(sectionId);
    setForm({ ...base, ...item, section: sectionId });
    setEditingId(item.id);
    setError(''); setOpenModal(true);
  }

  // فلتر الشهر — يظهر فقط في دروس النساء والرجال، حسب تاريخ الدرس (ميلادي)
  const GREG_MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
  const showMonthFilter = navSection === 'women' || navSection === 'men';
  function monthMatches(item, m) {
    if (!m) return true;
    const sd = item.startDate ? new Date(item.startDate + 'T00:00:00') : null;
    if (!sd || isNaN(sd)) return false;
    const ed = item.endDate ? new Date(item.endDate + 'T00:00:00') : null;
    if (ed && !isNaN(ed) && ed >= sd) {
      let y = sd.getFullYear(), mo = sd.getMonth();
      const ey = ed.getFullYear(), em = ed.getMonth();
      while (y < ey || (y === ey && mo <= em)) {
        if (mo + 1 === m) return true;
        mo++; if (mo > 11) { mo = 0; y++; }
      }
      return false;
    }
    return sd.getMonth() + 1 === m;
  }

  const filtered = programs.filter((p) => {
    const v = rowView(p);
    const matchesSearch = (v.name + ' ' + v.person + ' ' + v.mosque).toLowerCase().includes(searchQ.toLowerCase());
    const matchesSection = sectionFilter === 'all' || p.section === sectionFilter
      || (sectionFilter === 'general' && !p.section);
    const matchesPending = !pendingOnly || p.approval === 'pending';
    const matchesMonth = !showMonthFilter || !monthFilter || monthMatches(p, parseInt(monthFilter));
    return matchesSearch && matchesSection && matchesPending && matchesMonth;
  });
  const pendingCount = programs.filter((p) => p.approval === 'pending').length;

  /* ----- كشف تكرار المسجد ----- */
  /* توحيد اسم المسجد للمقارنة (حذف المسافات الزائدة وتوحيد الألف والتاء). */
  function normMosque(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').replace(/[\u0623\u0625\u0622]/g, '\u0627').replace(/\u0629/g, '\u0647').toLowerCase();
  }
  // قائمة المساجد المسجّلة سابقاً (للاقتراح وتوحيد الأسماء)
  const mosqueNames = React.useMemo(() => {
    const m = new Map();
    programs.forEach((p) => { const n = (p.mosque || '').trim(); if (n && !m.has(normMosque(n))) m.set(normMosque(n), n); });
    return [...m.values()].sort((a, b) => a.localeCompare(b, 'ar'));
  }, [programs]);
  // البرامج المسجّلة في نفس المسجد (باستثناء السجل الجاري تعديله)
  function existingAtMosque(val) {
    const key = normMosque(val);
    if (!key) return [];
    return programs.filter((p) => normMosque(p.mosque) === key && p.id !== editingId);
  }

  /* ----- عرض حقل واحد ----- */
  /* يُستدعى كدالة مباشرة (وليس كعنصر JSX) حتى لا يُعاد إنشاء الحقول عند كل ضغطة
     مفتاح، فيبقى مؤشّر الكتابة داخل الحقل ويمكن كتابة جملة كاملة. */
  function FieldInput(f) {
    const common = { width: '100%', height: 44, boxSizing: 'border-box', padding: '0 14px', fontFamily: 'var(--font-body)', fontSize: 'var(--text-md)', color: 'var(--text-strong)', background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', outline: 'none' };
    const label = (
      <label style={{ display: 'block', marginBottom: 6, fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-body)' }}>
        {f.label}{f.required && <span style={{ color: 'var(--red-600)', marginInlineStart: 4 }}>*</span>}
      </label>
    );
    let control;
    if (f.type === 'select' || f.type === 'select-manage') {
      const opts = f.type === 'select-manage' ? (lists[f.listKey] || []) : f.options;
      const selectEl = (
        <div style={{ position: 'relative', flex: 1 }}>
          <select value={form[f.key] || ''} onChange={(e) => setForm({ ...form, [f.key]: e.target.value })} style={{ ...common, appearance: 'none', paddingInlineStart: 38, cursor: 'pointer' }}>
            <option value="">{f.ph || '— اختر —'}</option>
            {opts.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
          <span style={{ position: 'absolute', insetInlineStart: 12, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: 'var(--text-subtle)' }}>▾</span>
        </div>
      );
      control = f.type === 'select-manage' ? (
        <div style={{ display: 'flex', gap: 8 }}>
          {selectEl}
          <button type="button" onClick={() => addListItem(f.listKey, f.key, f.addPrompt)} title="إضافة جديدة" style={{ flexShrink: 0, height: 44, padding: '0 14px', display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--blue-700)', background: 'var(--blue-50)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', cursor: 'pointer' }}>
            <Icon n="plus" size={15} />جديدة
          </button>
          <button type="button" onClick={() => deleteListItem(f.listKey, f.key)} title="حذف المحدّد" aria-label="حذف المحدّد" style={{ flexShrink: 0, width: 44, height: 44, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: 'var(--red-600)', background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', cursor: 'pointer' }}>
            <Icon n="trash-2" size={16} />
          </button>
        </div>
      ) : selectEl;
    } else if (f.type === 'textarea') {
      control = (
        <textarea value={form[f.key] || ''} placeholder={f.ph || ''}
          onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}
          style={{ ...common, height: 92, padding: '11px 14px', lineHeight: 1.7, resize: 'vertical', direction: 'rtl', textAlign: 'right' }} />
      );
    } else {
      control = (
        <input type={f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : f.type === 'tel' ? 'tel' : 'text'}
          value={form[f.key] || ''} placeholder={f.ph || ''}
          list={f.key === 'mosque' ? 'mh-known-mosques' : undefined}
          onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}
          style={{ ...common, direction: f.ltr ? 'ltr' : 'rtl', textAlign: f.ltr ? 'left' : 'right' }} />
      );
    }
    if (f.key === 'mosque') {
      const dup = existingAtMosque(form.mosque);
      const nm = (form.mosque || '').trim();
      return (
        <div>
          {label}{control}
          <datalist id="mh-known-mosques">
            {mosqueNames.map((n) => <option key={n} value={n}></option>)}
          </datalist>
          {dup.length > 0 && (
            <div style={{ marginTop: 10, display: 'flex', gap: 10, padding: '11px 14px', background: 'var(--status-warning-bg)', border: '1px solid var(--amber-300)', borderRadius: 'var(--radius-md)' }}>
              <span style={{ color: 'var(--status-warning-fg)', flexShrink: 0, marginTop: 1, display: 'inline-flex' }}><Icon n="alert-triangle" size={18} /></span>
              <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', lineHeight: 1.7, color: 'var(--text-body)' }}>
                <div style={{ fontWeight: 800, color: 'var(--status-warning-fg)', marginBottom: 2 }}>هذا المسجد به نشاط مُسجّل بالفعل</div>
                <div>مسجد «{nm}» مُسجّل عليه {dup.length} {dup.length === 1 ? 'برنامج' : 'برامج'} حالياً، يمكنك المتابعة إن أردت إضافة نشاط آخر:</div>
                <ul style={{ margin: '6px 0 0', paddingInlineStart: 18, display: 'flex', flexDirection: 'column', gap: 3 }}>
                  {dup.map((d) => { const sv = rowView(d); const st = statusView(d); return (
                    <li key={d.id} style={{ color: 'var(--text-body)' }}>
                      <strong style={{ color: 'var(--text-strong)' }}>{d.name || '—'}</strong>
                      <span style={{ color: 'var(--text-subtle)' }}> — {sv.sectionLabel} · {st.label}</span>
                    </li>
                  ); })}
                </ul>
              </div>
            </div>
          )}
        </div>
      );
    }
    return <div>{label}{control}</div>;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div>
          <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontSize: 'var(--text-3xl)', fontWeight: 800, color: 'var(--text-strong)' }}>{(sectionFilter !== 'all' && SECTION_BY_ID[sectionFilter]) ? SECTION_BY_ID[sectionFilter].label : 'البرامج'}</h1>
          <p style={{ margin: '4px 0 0 0', color: 'var(--text-muted)' }}>تسجيل سريع — اختر القسم وعبّئ حقوله المتخصصة.</p>
        </div>
        <Button onClick={openAdd} disabled={loading} iconStart={<Icon n="plus" size={16} />}>إضافة برنامج</Button>
      </div>

      {error && !openModal && (
        <div style={{ background: '#fdecea', color: '#c0392b', padding: 12, borderRadius: 10, fontSize: 14 }}>{error}</div>
      )}

      <Card padding={false}>
        <div style={{ padding: 16, borderBottom: '1px solid var(--border-subtle)', display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 220 }}>
            <Input placeholder="ابحث بالاسم أو المعلّم أو المسجد…" value={searchQ} onChange={(e) => setSearchQ(e.target.value)} icon={<Icon n="search" size={16} />} />
          </div>
          {showMonthFilter && (
            <div style={{ position: 'relative', minWidth: 170 }}>
              <span style={{ position: 'absolute', insetInlineStart: 12, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: 'var(--text-subtle)', display: 'inline-flex' }}><Icon n="calendar" size={16} /></span>
              <select value={monthFilter} onChange={(e) => setMonthFilter(e.target.value)} style={{ width: '100%', height: 44, boxSizing: 'border-box', appearance: 'none', padding: '0 38px', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, color: monthFilter ? 'var(--text-strong)' : 'var(--text-muted)', background: monthFilter ? 'var(--blue-50)' : 'var(--surface-card)', border: `1px solid ${monthFilter ? 'var(--blue-400)' : 'var(--border-default)'}`, borderRadius: 'var(--radius-md)', cursor: 'pointer' }}>
                <option value="">كل الأشهر</option>
                {GREG_MONTHS.map((m, i) => <option key={m} value={i + 1}>{m}</option>)}
              </select>
              <span style={{ position: 'absolute', insetInlineEnd: 12, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: 'var(--text-subtle)' }}>▾</span>
            </div>
          )}
          {isManager && pendingCount > 0 && (
            <button type="button" onClick={() => setPendingOnly((v) => !v)} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '9px 14px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, border: `1px solid ${pendingOnly ? 'var(--amber-300)' : 'var(--border-default)'}`, background: pendingOnly ? 'var(--status-warning-bg)' : 'var(--surface-card)', color: pendingOnly ? 'var(--status-warning-fg)' : 'var(--text-muted)' }}>
              <Icon n="clock" size={15} />تحت التدقيق
              <span style={{ fontSize: 'var(--text-xs)', fontWeight: 800, background: 'var(--status-warning-fg)', color: '#fff', borderRadius: 'var(--radius-pill)', padding: '1px 7px' }}>{pendingCount}</span>
            </button>
          )}
        </div>
        {loading ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>جاري التحميل…</div>
        ) : filtered.length === 0 ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>لا توجد برامج</div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14, fontFamily: 'var(--font-body)' }}>
              <thead>
                <tr style={{ background: 'var(--surface-sunken)' }}>
                  {['البرنامج', 'القسم', 'المعلّم / المسؤول', 'المسجد', 'العدد', 'الحالة', ''].map((h, i) => (
                    <th key={i} style={{ padding: '12px 16px', textAlign: 'start', fontWeight: 700, color: 'var(--text-subtle)', fontSize: 'var(--text-xs)', whiteSpace: 'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((item) => {
                  const v = rowView(item);
                  return (
                    <tr key={item.id} style={{ borderTop: '1px solid var(--border-subtle)' }}>
                      <td style={{ padding: '12px 16px', fontWeight: 700, color: 'var(--text-strong)' }}>{v.name}</td>
                      <td style={{ padding: '12px 16px' }}><Badge color="brand">{v.sectionLabel}</Badge></td>
                      <td style={{ padding: '12px 16px', color: 'var(--text-body)' }}>{v.person}</td>
                      <td style={{ padding: '12px 16px', color: 'var(--text-muted)' }}>{v.mosque}</td>
                      <td style={{ padding: '12px 16px', fontVariantNumeric: 'tabular-nums' }}>{v.count}</td>
                      <td style={{ padding: '12px 16px' }}>
                        {item.approval === 'pending'
                          ? <Badge color="yellow" dot>تحت التدقيق</Badge>
                          : (() => { const st = statusView(item); return <Badge color={st.color} dot>{st.label}</Badge>; })()}
                      </td>
                      <td style={{ padding: '12px 16px', textAlign: 'left' }}>
                        <div style={{ display: 'flex', gap: 4 }}>
                          {isManager && item.approval === 'pending' && <IconButton label="اعتماد" onClick={() => handleApprove(item)} style={{ color: 'var(--green-600)' }}><Icon n="badge-check" size={16} /></IconButton>}
                          <IconButton label="تعديل" onClick={() => handleEdit(item)} style={{ color: 'var(--blue-600)' }}><Icon n="pencil" size={16} /></IconButton>
                          {isManager && <IconButton label="حذف" onClick={() => handleDelete(item)} style={{ color: 'var(--red-600)' }}><Icon n="trash-2" size={16} /></IconButton>}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {openModal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 16 }}>
          <div style={{ width: 640, maxWidth: '100%', maxHeight: '92vh', display: 'flex', flexDirection: 'column', background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-lg)', overflow: 'hidden' }}>
            <div style={{ padding: '18px 22px', borderBottom: '1px solid var(--border-subtle)', flexShrink: 0 }}>
              <h2 style={{ margin: 0, fontSize: 20, fontFamily: 'var(--font-display)', fontWeight: 800, color: 'var(--text-strong)' }}>{editingId ? (currentSection.editTitle || 'تعديل برنامج') : (currentSection.addTitle || 'تسجيل برنامج جديد')}</h2>
            </div>

            <div style={{ padding: 22, overflowY: 'auto', flex: 1, minHeight: 0 }}>
              {/* اختيار القسم السريع — يظهر فقط في عرض «جميع البرامج» */}
              {!editingId && sectionFilter === 'all' && (
                <div style={{ marginBottom: 22 }}>
                  <div style={{ fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-body)', marginBottom: 10 }}>اختر القسم</div>
                  <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                    {PROGRAM_SECTIONS.map((s) => {
                      const active = form.section === s.id;
                      return (
                        <button key={s.id} onClick={() => selectSection(s.id)} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '9px 14px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, border: `1px solid ${active ? 'var(--brand)' : 'var(--border-default)'}`, background: active ? 'var(--blue-50)' : 'var(--surface-card)', color: active ? 'var(--blue-700)' : 'var(--text-muted)' }}>
                          <Icon n={s.icon} size={15} />{s.label}
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}

              {error && <div style={{ background: '#fdecea', color: '#c0392b', padding: 12, borderRadius: 10, fontSize: 14, marginBottom: 16 }}>{error}</div>}

              {/* حقول القسم المتخصصة */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                {currentSection.fields.map((f) => (
                  <div key={f.key} style={{ gridColumn: (f.full || f.col === 'name') ? '1 / -1' : 'auto' }}>
                    {FieldInput(f)}
                  </div>
                ))}
              </div>

              {/* الحالة */}
              <div style={{ marginTop: 18, display: 'flex', alignItems: 'center', gap: 10 }}>
                <label style={{ fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-body)' }}>الحالة:</label>
                {window.Switch && (
                  <window.Switch checked={form.status === 'active'} onChange={(v) => setForm({ ...form, status: v ? 'active' : 'inactive' })} label={form.status === 'active' ? 'نشط' : 'متوقف'} />
                )}
              </div>
            </div>

            <div style={{ padding: '16px 22px', borderTop: '1px solid var(--border-subtle)', display: 'flex', gap: 10, flexShrink: 0 }}>
              <Button onClick={handleSave} disabled={loading} style={{ flex: 1 }} iconStart={<Icon n="check" size={16} />}>{editingId ? (currentSection.saveLabel || 'حفظ التعديل') : (currentSection.saveLabel || 'تسجيل')}</Button>
              <Button variant="secondary" onClick={() => { setOpenModal(false); setEditingId(null); setError(''); }} disabled={loading} style={{ flex: 1 }}>إلغاء</Button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function FilterChip({ active, onClick, label, count, icon }) {
  const { Icon } = window;
  return (
    <button onClick={onClick} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, padding: '7px 13px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, border: `1px solid ${active ? 'var(--brand)' : 'var(--border-default)'}`, background: active ? 'var(--blue-50)' : 'var(--surface-card)', color: active ? 'var(--blue-700)' : 'var(--text-muted)' }}>
      {icon && <Icon n={icon} size={14} />}{label}
      {count != null && <span style={{ fontSize: 'var(--text-xs)', fontWeight: 700, background: active ? 'var(--blue-100)' : 'var(--surface-sunken)', color: active ? 'var(--blue-700)' : 'var(--text-subtle)', borderRadius: 'var(--radius-pill)', padding: '1px 7px' }}>{count}</span>}
    </button>
  );
}
window.ProgramsScreen = ProgramsScreen;
/* مساعدات مشتركة للتقارير (نفس منطق التطبيع المستخدم في جدول البرامج) */
Object.assign(window, { PROGRAM_SECTIONS, SECTION_BY_ID, rowView, statusView });

</script>

<script type="text/babel" data-presets="react">
/* ===== live-data.jsx ===== */
/* طبقة بيانات حية موحّدة — تجمع كل المصادر (برامج + دروس + حلقات + أئمة + ضيوف)
   وتحسب الأعداد المعروضة في القائمة الجانبية ولوحة المعلومات.
   كل الأرقام تُحسب من البيانات الفعلية، فتتغيّر فور أي إضافة أو حذف. */

async function _fetchNode(path) {
  try {
    const r = await fetch(`${window.FIREBASE_DB_URL}/${path}.json?key=${window.FIREBASE_API_KEY}`);
    if (!r.ok) return null;
    return await r.json();
  } catch (_) { return null; }
}

function _toArr(o) { return o ? Object.entries(o).map(([id, v]) => ({ id, ...(v || {}) })) : []; }

function _num(x) {
  const v = (x.count != null && x.count !== '') ? x.count
    : (x.attendees != null && x.attendees !== '') ? x.attendees
    : (x.studentsCount != null && x.studentsCount !== '') ? x.studentsCount
    : (x.beneficiaries != null && x.beneficiaries !== '') ? x.beneficiaries : 0;
  return parseInt(v) || 0;
}

async function loadLiveData() {
  const [programs, women, men, halaqat, imams, guests] = await Promise.all([
    _fetchNode('programs'), _fetchNode('lessons/women'), _fetchNode('lessons/men'),
    _fetchNode('halaqat'), _fetchNode('imams'), _fetchNode('guests'),
  ]);

  const progArr = _toArr(programs);
  const wArr = _toArr(women).map((x) => ({ ...x, section: 'women', _legacy: 'women' }));
  const mArr = _toArr(men).map((x) => ({ ...x, section: 'men', _legacy: 'men' }));
  const halArr = _toArr(halaqat);
  const imamArr = _toArr(imams);
  const guestArr = _toArr(guests);

  const bySec = (s) => progArr.filter((p) => p.section === s).length;
  const womenCount = bySec('women') + wArr.length;
  const menCount = bySec('men') + mArr.length;
  const communitiesCount = bySec('communities');
  const generalCount = progArr.filter((p) => p.section === 'general' || !p.section).length;
  const halaqatCount = bySec('halaqat') + halArr.length;
  const imamsCount = bySec('imam') + imamArr.length;
  const guestsCount = bySec('guests') + guestArr.length;
  const competitionsCount = bySec('competitions');
  const preachersCount = bySec('preachers');
  const allCount = progArr.length + wArr.length + mArr.length + guestArr.length;

  const everything = [...progArr, ...wArr, ...mArr, ...halArr, ...guestArr];
  const beneficiaries = everything.reduce((s, x) => s + _num(x), 0);
  const activeHalaqat = halArr.filter((h) => !h.status || h.status === 'active').length
    + progArr.filter((p) => p.section === 'halaqat' && (!p.status || p.status === 'active')).length;

  const counts = {
    all: allCount, 'women-lessons': womenCount, 'men-lessons': menCount,
    halaqat: halaqatCount, communities: communitiesCount, imams: imamsCount, guests: guestsCount,
    competitions: competitionsCount,
    preachers: preachersCount,
  };

  const cats = [
    { label: 'دروس نسائية', n: womenCount, color: 'var(--terracotta-500)' },
    { label: 'دروس رجال', n: menCount, color: 'var(--maroon-500)' },
    { label: 'حلقات', n: halaqatCount, color: 'var(--amber-500)' },
    { label: 'جاليات', n: communitiesCount, color: 'var(--blue-500)' },
    { label: 'برامج عامة', n: generalCount, color: 'var(--green-500)' },
  ];
  const maxN = Math.max(1, ...cats.map((c) => c.n));
  cats.forEach((c) => { c.pct = Math.round((c.n / maxN) * 100); });

  const toneMap = { green: 'success', red: 'danger', yellow: 'warning', gray: 'neutral' };
  const merged = [...progArr, ...wArr, ...mArr, ...guestArr];
  const recent = merged.slice(-5).reverse().map((p) => {
    const v = window.rowView ? window.rowView(p) : { name: p.name || '—', sectionLabel: p.section || '—', person: p.instructor || p.sheikhName || '—', count: _num(p) };
    const st = window.statusView ? window.statusView(p) : { label: p.status === 'active' ? 'فعّالة' : 'متوقف', color: p.status === 'active' ? 'green' : 'gray' };
    return { id: p.id, name: v.name, cat: v.sectionLabel, tone: 'brand', owner: v.person, students: v.count, status: st.label, stone: toneMap[st.color] || 'neutral' };
  });

  const stats = { total: allCount, activeHalaqat, beneficiaries, imams: imamsCount, cats, recent };

  // البرامج الجديدة بانتظار اعتماد رئيس القسم (التي قدّمها الموظفون)
  const pendingSrc = [...progArr, ...wArr, ...mArr, ...halArr, ...guestArr, ...imamArr];
  const pending = pendingSrc.filter((p) => p.approval === 'pending').map((p) => {
    const v = window.rowView ? window.rowView(p) : null;
    return { id: p.id, name: (v && v.name) || p.name || 'برنامج', sectionLabel: (v && v.sectionLabel) || '', mosque: p.mosque || '', section: p.section };
  });

  return { counts, stats, pending };
}

window.loadLiveData = loadLiveData;

/* ============================================================
   طباعة تقارير القسم — مستند A4 نظيف ومرتّب (مستقل عن واجهة الشاشة)
   ============================================================ */
function _esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function _statusColor(c) {
  return c === 'green' ? '#1F8A5B' : c === 'red' ? '#C0392B' : c === 'yellow' ? '#B7791F' : '#6B6256';
}

/* تجميع كل البرامج في قائمة موحّدة منسّقة */
async function gatherPrintRows() {
  const [programs, women, men, halaqat, imams, guests] = await Promise.all([
    _fetchNode('programs'), _fetchNode('lessons/women'), _fetchNode('lessons/men'),
    _fetchNode('halaqat'), _fetchNode('imams'), _fetchNode('guests'),
  ]);
  const progArr = _toArr(programs);
  const wArr = _toArr(women).map((x) => ({ ...x, section: 'women', _legacy: 'women' }));
  const mArr = _toArr(men).map((x) => ({ ...x, section: 'men', _legacy: 'men' }));
  const halArr = _toArr(halaqat);
  const imamArr = _toArr(imams);
  const guestArr = _toArr(guests);
  const merged = [...progArr, ...wArr, ...mArr, ...halArr, ...guestArr, ...imamArr];
  const rv = window.rowView, sv = window.statusView;
  return merged.map((p) => {
    const v = rv ? rv(p) : { name: p.name || '—', sectionLabel: p.section || '—', person: '—', mosque: p.mosque || '—', count: _num(p) };
    const st = sv ? sv(p) : { label: 'فعّالة', color: 'green' };
    return {
      name: v.name || '—', section: v.sectionLabel || '—', person: v.person || '—',
      mosque: v.mosque || '—', count: (v.count == null || v.count === '') ? '—' : v.count,
      status: st.label, statusColor: _statusColor(st.color),
    };
  });
}
