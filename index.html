<script type="text/babel" data-presets="react">
/* ===== ReportsScreens.jsx ===== */
/* تقارير القسم — تُحسب لحظياً من بيانات البرامج (Firebase / محلي).
   صفحتان: «إنجاز الموظفين» و«تقرير البرامج» (النوع · المسجد · عدد المساجد). */

/* ----- ألوان الأقسام (مشتقّة من بطاقة توزيع البرامج في الرئيسية) ----- */
const REPORT_SECTION_COLORS = {
  'حلقات قرآن': 'var(--amber-500)',
  'حلقات': 'var(--amber-500)',
  'دروس نسائية': 'var(--terracotta-500)',
  'دروس رجال': 'var(--maroon-500)',
  'جاليات': 'var(--blue-500)',
  'إمام متطوع': 'var(--green-500)',
  'ضيوف من الخارج': 'var(--blue-700)',
  'برامج عامة': 'var(--green-700)',
};
function reportSectionColor(label) { return REPORT_SECTION_COLORS[label] || 'var(--text-subtle)'; }

/* توحيد اسم المسجد للعدّ (تجاهل الفروقات الإملائية البسيطة). */
function reportNormMosque(s) {
  return String(s || '').trim().replace(/\s+/g, ' ').replace(/[\u0623\u0625\u0622]/g, '\u0627').replace(/\u0629/g, '\u0647').toLowerCase();
}

/* جلب البرامج من نفس مصدر شاشة «البرامج». */
function useReportPrograms() {
  const [programs, setPrograms] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState('');
  React.useEffect(() => {
    let alive = true;
    (async () => {
      try {
        setLoading(true);
        const r = await fetch(`${window.FIREBASE_DB_URL}/programs.json?key=${window.FIREBASE_API_KEY}`);
        if (!r.ok) throw new Error('fail');
        const data = await r.json();
        const arr = data ? Object.entries(data).map(([id, item]) => ({ id, ...item })) : [];
        if (alive) { setPrograms(arr); setError(''); }
      } catch (e) {
        if (alive) { setError('تعذّر تحميل البيانات. تحقّق من الاتصال أو المزامنة.'); setPrograms([]); }
      } finally { if (alive) setLoading(false); }
    })();
    return () => { alive = false; };
  }, []);
  return { programs, loading, error };
}

/* تطبيع كل برنامج إلى صف موحّد للتقارير. */
function reportRows(programs) {
  const rowView = window.rowView;
  return (programs || []).map((p) => {
    const v = rowView ? rowView(p) : { name: p.name || '—', sectionLabel: 'برامج عامة', person: '—', mosque: p.mosque || '—' };
    const count = Number(p.count != null && p.count !== '' ? p.count
      : p.beneficiaries != null ? p.beneficiaries
      : p.studentsCount != null ? p.studentsCount
      : p.attendees != null ? p.attendees : 0) || 0;
    const mosque = (p.mosque || '').trim();
    const association = (p.association || p.entity || '').trim();
    return {
      id: p.id,
      name: v.name,
      section: v.sectionLabel,
      person: v.person && v.person !== '—' ? v.person : 'غير محدّد',
      mosque: mosque || 'غير محدّد',
      area: (p.area || '').trim(),
      association: association || 'غير محدّدة',
      employee: (p.createdByName || p.createdBy || '').trim(),
      count,
    };
  });
}

function uniqueSectionList(rows) {
  return [...new Set(rows.map((r) => r.section))];
}

/* ====================== مكوّنات عرض صغيرة ====================== */

function ReportToolbar({ title, subtitle }) {
  const { Button, Icon } = window;
  return (
    <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 16, flexWrap: 'wrap' }}>
      <div>
        <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontSize: 'var(--text-3xl)', fontWeight: 800, color: 'var(--text-strong)' }}>{title}</h1>
        <p style={{ margin: '4px 0 0 0', fontFamily: 'var(--font-body)', color: 'var(--text-muted)' }}>{subtitle}</p>
      </div>
      <Button variant="secondary" onClick={() => window.print()} iconStart={<Icon n="printer" size={16} />}>طباعة التقرير</Button>
    </div>
  );
}

function SectionDot({ label }) {
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 7, fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', color: 'var(--text-body)', whiteSpace: 'nowrap' }}>
      <span style={{ width: 9, height: 9, borderRadius: '50%', flexShrink: 0, background: reportSectionColor(label) }} />
      {label}
    </span>
  );
}

/* أشرطة توزيع (نفس أسلوب «توزيع البرامج» في الرئيسية) */
function DistributionBars({ items, total }) {
  const max = Math.max(1, ...items.map((i) => i.n));
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      {items.map((c) => (
        <div key={c.label} style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)' }}>
            <span style={{ color: 'var(--text-body)', fontWeight: 500 }}>{c.label}</span>
            <span style={{ color: 'var(--text-subtle)', fontVariantNumeric: 'tabular-nums' }}>{c.n}{total ? ` · ${Math.round((c.n / total) * 100)}%` : ''}</span>
          </div>
          <div style={{ height: 8, borderRadius: 'var(--radius-pill)', background: 'var(--surface-sunken)', overflow: 'hidden' }}>
            <div style={{ width: (c.n / max) * 100 + '%', height: '100%', background: reportSectionColor(c.label), borderRadius: 'var(--radius-pill)' }} />
          </div>
        </div>
      ))}
    </div>
  );
}

function EmptyState({ icon, text }) {
  const { Icon } = window;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 12, padding: '48px 20px', textAlign: 'center' }}>
      <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 56, height: 56, borderRadius: 'var(--radius-xl)', background: 'var(--blue-50)', color: 'var(--blue-500)' }}>
        <Icon n={icon} size={26} />
      </span>
      <p style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-md)', color: 'var(--text-muted)', maxWidth: 360 }}>{text}</p>
    </div>
  );
}

function SectionFilterChips({ rows, value, onChange }) {
  const sections = ['الكل', ...uniqueSectionList(rows)];
  return (
    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
      {sections.map((s) => {
        const active = s === value;
        return (
          <button key={s} onClick={() => onChange(s)} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '8px 14px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, border: `1px solid ${active ? 'var(--brand)' : 'var(--border-default)'}`, background: active ? 'var(--blue-50)' : 'var(--surface-card)', color: active ? 'var(--blue-700)' : 'var(--text-muted)' }}>
            {s !== 'الكل' && <span style={{ width: 8, height: 8, borderRadius: '50%', background: reportSectionColor(s) }} />}
            {s}
          </button>
        );
      })}
    </div>
  );
}

/* ====================== صفحة: إنجاز الموظفين ====================== */

/* تفاصيل معاملات الموظف عند التوسع: ماذا أنجز بالتفصيل. */
function StaffDetail({ items }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8, background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', padding: 12 }}>
      <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', fontWeight: 700, color: 'var(--text-subtle)', padding: '2px 4px 6px' }}>
        المعاملات المنجَزة ({items.length})
      </div>
      {items.map((it, i) => (
        <div key={it.id || i} style={{ display: 'grid', gridTemplateColumns: '22px 1.6fr 1fr 1fr auto', alignItems: 'center', gap: 12, padding: '9px 8px', borderRadius: 'var(--radius-md)', background: 'var(--surface-sunken)', fontFamily: 'var(--font-body)' }}>
          <span style={{ fontSize: 'var(--text-xs)', fontWeight: 700, color: 'var(--text-subtle)', fontVariantNumeric: 'tabular-nums', textAlign: 'center' }}>{i + 1}</span>
          <span style={{ fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-strong)' }}>{it.name}</span>
          <SectionDot label={it.section} />

function StaffReportScreen({ role }) {
  const { Card, Button, Icon, Avatar, StatTile, Input } = window;
  const { programs, loading, error } = useReportPrograms();
  const [q, setQ] = React.useState('');
  const [sec, setSec] = React.useState('الكل');
  const [open, setOpen] = React.useState(null);

  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const rows = React.useMemo(() => reportRows(programs), [programs]);
  const scoped = React.useMemo(() => rows.filter((r) => sec === 'الكل' || r.section === sec), [rows, sec]);

  const staff = React.useMemo(() => {
    const m = {};
    scoped.forEach((r) => {
      const key = r.employee || 'غير محدّد';
      if (!m[key]) m[key] = { name: key, programs: 0, beneficiaries: 0, mosques: new Set(), sections: {}, items: [] };
      const o = m[key];
      o.programs++; o.beneficiaries += r.count;
      if (r.mosque && r.mosque !== 'غير محدّد') o.mosques.add(reportNormMosque(r.mosque));
      o.sections[r.section] = (o.sections[r.section] || 0) + 1;
      o.items.push(r);
    });
    return Object.values(m)
      .map((o) => ({ ...o, mosques: o.mosques.size, topSection: Object.entries(o.sections).sort((a, b) => b[1] - a[1])[0], items: o.items.slice().sort((a, b) => b.count - a.count) }))
      .sort((a, b) => b.programs - a.programs || b.beneficiaries - a.beneficiaries);
  }, [scoped]);

  const visible = staff.filter((s) => s.name.toLowerCase().includes(q.trim().toLowerCase()));
  const maxPrograms = Math.max(1, ...staff.map((s) => s.programs));
  const totals = {
    people: staff.length,
    programs: scoped.length,
    beneficiaries: scoped.reduce((a, r) => a + r.count, 0),
    avg: staff.length ? Math.round(scoped.length / staff.length) : 0,
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 1180 }}>
      <ReportToolbar title="إنجاز الموظفين" subtitle="كم معاملة أنجز كل موظف وماذا أنجز — اضغط على اسم الموظف لعرض تفاصيل معاملاته." />

      {error && <div style={{ background: '#fdecea', color: '#c0392b', padding: 12, borderRadius: 10, fontSize: 14 }}>{error}</div>}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
        <StatTile icon={<Icon n="users" size={22} />} value={totals.people} label="الموظفون / المسؤولون" tone="brand" />
        <StatTile icon={<Icon n="book-open" size={22} />} value={totals.programs} label="إجمالي المعاملات" tone="info" />
        <StatTile icon={<Icon n="user-check" size={22} />} value={totals.beneficiaries.toLocaleString('en-US')} label="إجمالي المستفيدين" tone="success" />
        <StatTile icon={<Icon n="bar-chart-3" size={22} />} value={totals.avg} label="متوسط المعاملات لكل موظف" tone="maroon" />
      </div>

      <Card>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <SectionFilterChips rows={rows} value={sec} onChange={setSec} />
          <Input placeholder="ابحث باسم الموظف…" value={q} onChange={(e) => setQ(e.target.value)} icon={<Icon n="search" size={16} />} />
        </div>
      </Card>

      <Card title="ترتيب الإنجاز" padding={false}>
        {loading ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>جاري التحميل…</div>
        ) : visible.length === 0 ? (
          <EmptyState icon="award" text="لا توجد بيانات إنجاز بعد. تظهر النتائج تلقائياً عند تسجيل البرامج." />
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--font-body)' }}>
              <thead>
                <tr style={{ background: 'var(--surface-sunken)' }}>
                  {['#', 'الموظف', 'المعاملات', 'المستفيدون', 'المساجد', 'أبرز قسم', ''].map((h, i) => (
                    <th key={i} style={{ textAlign: 'start', padding: '11px 16px', fontSize: 'var(--text-xs)', fontWeight: 700, color: 'var(--text-subtle)', whiteSpace: 'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {visible.map((s, idx) => {
                  const isOpen = open === s.name;

            </table>

        )}

function ProgramsReportScreen({ role }) {
  const { Card, Badge, Icon, StatTile, Input } = window;
  const { programs, loading, error } = useReportPrograms();
  const [q, setQ] = React.useState('');
  const [sec, setSec] = React.useState('الكل');

  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  const rows = React.useMemo(() => reportRows(programs), [programs]);
  const scoped = React.useMemo(() => rows.filter((r) => sec === 'الكل' || r.section === sec), [rows, sec]);

  const bySection = React.useMemo(() => {
    const m = {};
    scoped.forEach((r) => { m[r.section] = (m[r.section] || 0) + 1; });
    return Object.entries(m).map(([label, n]) => ({ label, n })).sort((a, b) => b.n - a.n);
  }, [scoped]);

  const byMosque = React.useMemo(() => {
    const m = {};
    scoped.forEach((r) => {
      const key = r.mosque;
      if (!m[key]) m[key] = { mosque: key, area: r.area, programs: 0, beneficiaries: 0, sections: {} };
      const o = m[key];
      o.programs++; o.beneficiaries += r.count;
      if (r.area) o.area = r.area;
      o.sections[r.section] = (o.sections[r.section] || 0) + 1;
    });
    return Object.values(m).sort((a, b) => b.programs - a.programs);
  }, [scoped]);

  /* إحصائية كل جمعية / لجنة / مبرّة: عدد المساجد المسجّلة تحتها. */
  const byAssociation = React.useMemo(() => {
    const m = {};
    scoped.forEach((r) => {
      const key = r.association;
      if (!m[key]) m[key] = { association: key, mosques: new Set(), programs: 0, beneficiaries: 0, sections: {} };
      const o = m[key];
      o.programs++; o.beneficiaries += r.count;
      if (r.mosque && r.mosque !== 'غير محدّد') o.mosques.add(reportNormMosque(r.mosque));
      o.sections[r.section] = (o.sections[r.section] || 0) + 1;
    });
    return Object.values(m)
      .map((o) => ({ ...o, mosques: o.mosques.size }))
      .sort((a, b) => b.mosques - a.mosques || b.programs - a.programs);
  }, [scoped]);

  const mosqueCount = byMosque.filter((m) => m.mosque !== 'غير محدّد').length;
  const visibleMosques = byMosque.filter((m) => (m.mosque + ' ' + m.area).toLowerCase().includes(q.trim().toLowerCase()));
  const totals = {
    programs: scoped.length,
    mosques: mosqueCount,
    sections: bySection.length,
    beneficiaries: scoped.reduce((a, r) => a + r.count, 0),

    <div style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 1180 }}>

      {error && <div style={{ background: '#fdecea', color: '#c0392b', padding: 12, borderRadius: 10, fontSize: 14 }}>{error}</div>}

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 16 }}>
        <StatTile icon={<Icon n="book-open" size={22} />} value={totals.programs} label="إجمالي البرامج" tone="brand" />
        <StatTile icon={<Icon n="building-2" size={22} />} value={totals.mosques} label="عدد المساجد" tone="maroon" />
        <StatTile icon={<Icon n="layers" size={22} />} value={totals.sections} label="عدد الأنواع" tone="info" />
        <StatTile icon={<Icon n="user-check" size={22} />} value={totals.beneficiaries.toLocaleString('en-US')} label="إجمالي المستفيدين" tone="success" />
      </div>

      <Card>
        <SectionFilterChips rows={rows} value={sec} onChange={setSec} />
      </Card>

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1.6fr', gap: 16, alignItems: 'start' }}>
        <Card title="البرامج حسب النوع">
          {loading ? (
            <div style={{ textAlign: 'center', padding: 24, color: 'var(--text-muted)' }}>جاري التحميل…</div>
          ) : bySection.length === 0 ? (
            <EmptyState icon="layers" text="لا توجد برامج مسجّلة بعد." />
          ) : (
            <DistributionBars items={bySection} total={totals.programs} />
          )}
        </Card>

        <Card title="البرامج حسب المسجد" padding={false} action={<span style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--text-subtle)' }}>{mosqueCount} مسجد</span>}>
          <div style={{ padding: 16, borderBottom: '1px solid var(--border-subtle)' }}>
            <Input placeholder="ابحث عن مسجد أو حي…" value={q} onChange={(e) => setQ(e.target.value)} icon={<Icon n="search" size={16} />} />
          </div>
          {loading ? (
            <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>جاري التحميل…</div>
          ) : visibleMosques.length === 0 ? (
            <EmptyState icon="building-2" text="لا توجد مساجد مطابقة." />
          ) : (
            <div style={{ overflowX: 'auto' }}>
              <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--font-body)' }}>
                <thead>
                  <tr style={{ background: 'var(--surface-sunken)' }}>
                    {['المسجد', 'الحي', 'البرامج', 'الأنواع', 'المستفيدون'].map((h, i) => (
                      <th key={i} style={{ textAlign: 'start', padding: '11px 16px', fontSize: 'var(--text-xs)', fontWeight: 700, color: 'var(--text-subtle)', whiteSpace: 'nowrap' }}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {visibleMosques.map((m) => (
                    <tr key={m.mosque} style={{ borderTop: '1px solid var(--border-subtle)' }}>
                      <td style={{ padding: '12px 16px', fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-strong)' }}>
                        <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8 }}>
                          <span style={{ display: 'inline-flex', color: 'var(--maroon-500)' }}><Icon n="building-2" size={16} /></span>

                      <td style={{ padding: '12px 16px' }}>
                        <span style={{ display: 'inline-flex', gap: 6, flexWrap: 'wrap' }}>
                          {Object.keys(m.sections).map((label) => <SectionDot key={label} label={label} />)}
                        </span>
                      </td>
                      <td style={{ padding: '12px 16px', fontSize: 'var(--text-sm)', color: 'var(--text-body)', fontVariantNumeric: 'tabular-nums' }}>{m.beneficiaries.toLocaleString('en-US')}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </Card>
      </div>

      <Card title="عدد المساجد لكل جمعية / لجنة / مبرّة" padding={false} action={<span style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', color: 'var(--text-subtle)' }}>{byAssociation.length} جهة</span>}>
        {loading ? (

        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontFamily: 'var(--font-body)' }}>
              <thead>
                <tr style={{ background: 'var(--surface-sunken)' }}>
                  {['الجمعية / اللجنة / المبرّة', 'عدد المساجد', 'البرامج', 'الأنواع', 'المستفيدون'].map((h, i) => (
                    <th key={i} style={{ textAlign: 'start', padding: '11px 16px', fontSize: 'var(--text-xs)', fontWeight: 700, color: 'var(--text-subtle)', whiteSpace: 'nowrap' }}>{h}</th>

              <tbody>
                {byAssociation.map((a) => {

<script type="text/babel" data-presets="react">
/* ===== HalaqatScreen.jsx ===== */
/* نظام الحلقات — Firebase Realtime Database (REST API)
   نفس تقسيمة «إضافة حلقة جديدة»: نوع الطلاب، عدد الطلاب، اسم المسجد،
   المنطقة (+ إضافة/حذف)، الجمعية، تاريخ البداية/النهاية، ملاحظات + مؤشر حالة. */

const HALAQAT_AREAS_DEFAULT = ['حولي', 'السالمية', 'الرميثية', 'بيان', 'مشرف', 'سلوى', 'الجابرية', 'الشعب', 'النقرة', 'حطين', 'الزهراء', 'الصديق', 'الشهداء', 'السلام', 'البدع'];
const HALAQAT_ASSOC_DEFAULT = ['جمعية إحياء التراث الإسلامي', 'جمعية النجاة الخيرية', 'الجمعية الثقافية الاجتماعية', 'لجنة التعريف بالإسلام', 'بيت الزكاة', 'الأمانة العامة للأوقاف', 'أخرى'];

const HALAQA_FIELDS = [
  { key: 'name', label: 'اسم الجهة', type: 'text', required: true, ph: 'مثال: حلقة الإتقان', full: true },
  { key: 'studentType', label: 'نوع الطلاب', type: 'select', options: ['بنين', 'بنات', 'بنين-بنات'], required: true },
  { key: 'count', label: 'عدد الطلاب', type: 'number', required: true },
  { key: 'days', label: 'أيام الحلقات', type: 'text', ph: 'مثال: السبت والإثنين والأربعاء', full: true },
  { key: 'mosque', label: 'اسم المسجد', type: 'text', required: true, ph: 'مثال: مسجد الرحمة', full: true },
  { key: 'area', label: 'المنطقة', type: 'select-manage', listKey: 'areas', addPrompt: 'اسم المنطقة الجديدة', ph: '-- اختر المنطقة --', full: true },
  { key: 'association', label: 'الجمعية أو الجهة المسؤولة', type: 'select-manage', listKey: 'associations', addPrompt: 'اسم الجمعية أو الجهة الجديدة', ph: '-- اختر الجمعية --', full: true },
  { key: 'coordinatorPhone', label: 'رقم منسق الحلقات', type: 'tel', ph: 'مثال: 9XXXXXXX', full: true },
  { key: 'startDate', label: 'تاريخ البداية', type: 'date' },
  { key: 'endDate', label: 'تاريخ النهاية', type: 'date' },
  { key: 'notes', label: 'ملاحظات', type: 'textarea', ph: 'أي ملاحظات إضافية…', full: true },
];

function emptyHalaqa() {
  return { name: '', studentType: '', count: '', days: '', mosque: '', area: '', association: '', coordinatorPhone: '', startDate: '', endDate: '', notes: '', status: 'active' };
}

/* حالة الحلقة حسب الحالة اليدوية وتاريخ النهاية (التصريح) */
function halaqaStatusView(item) {
  if (item.status && item.status !== 'active') return { label: 'متوقف', color: 'gray' };
  const end = item.endDate ? new Date(item.endDate + 'T00:00:00') : null;
  if (end && !isNaN(end)) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((end - today) / 86400000);
    if (days < 0) return { label: 'انتهى التصريح', color: 'red' };
    if (days <= 14) return { label: 'قرب الانتهاء', color: 'yellow' };
  }
  return { label: 'فعّالة', color: 'green' };
}

function HalaqatScreen({ role }) {
  const { Badge, Button, IconButton, Input, Icon } = window;
  const isManager = role === 'section_manager';

  const [halaqat, setHalaqat] = React.useState([]);
  const [filterTab, setFilterTab] = React.useState('all');
  const [pendingOnly, setPendingOnly] = React.useState(false);
  const [searchQ, setSearchQ] = React.useState('');
  const [openModal, setOpenModal] = React.useState(false);
  const [editingId, setEditingId] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState('');
  const [form, setForm] = React.useState(emptyHalaqa());

  const DB_URL = window.FIREBASE_DB_URL;
  const API_KEY = window.FIREBASE_API_KEY;

  // قوائم المناطق/الجمعيات — مشتركة عبر Firebase (نفس مفتاح صفحة البرامج)
  const [lists, setLists] = React.useState(() => {
    try { const c = JSON.parse(localStorage.getItem('mh_lists') || '{}');
      return { areas: (c.areas && c.areas.length) ? c.areas : HALAQAT_AREAS_DEFAULT, associations: (c.associations && c.associations.length) ? c.associations : HALAQAT_ASSOC_DEFAULT };
    } catch (_) { return { areas: HALAQAT_AREAS_DEFAULT, associations: HALAQAT_ASSOC_DEFAULT }; }
  });

  React.useEffect(() => { loadHalaqat(); loadLists(); }, []);
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  async function loadLists() {
    try {
      const r = await fetch(`${DB_URL}/settings.json?key=${API_KEY}`);
      if (!r.ok) return;
      const s = await r.json();
      if (!s) return;
      setLists((prev) => {
        const next = {
          areas: (Array.isArray(s.areas) && s.areas.length) ? s.areas : prev.areas,
          associations: (Array.isArray(s.associations) && s.associations.length) ? s.associations : prev.associations,
        };
        try { localStorage.setItem('mh_lists', JSON.stringify(next)); } catch (_) {}
        return next;
      });
    } catch (_) {}
  }

  function persistList(key, arr) {
    setLists((prev) => {
      const next = { ...prev, [key]: arr };
      try { localStorage.setItem('mh_lists', JSON.stringify(next)); } catch (_) {}
      return next;
    });
    try { fetch(`${DB_URL}/settings/${key}.json?key=${API_KEY}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(arr) }); } catch (_) {}
  }

  function addListItem(listKey, fieldKey, promptText) {
    const v = (window.prompt(promptText) || '').trim();
    if (!v) return;
    const cur = lists[listKey] || [];
    if (!cur.includes(v)) persistList(listKey, [...cur, v]);
    setForm((prev) => ({ ...prev, [fieldKey]: v }));
  }

  function deleteListItem(listKey, fieldKey) {
    const cur = form[fieldKey];
    if (!cur) { window.alert('اختر العنصر المراد حذفه من القائمة أولاً.'); return; }
    if (!window.confirm('حذف «' + cur + '» من القائمة نهائياً؟')) return;
    persistList(listKey, (lists[listKey] || []).filter((x) => x !== cur));
    setForm((prev) => ({ ...prev, [fieldKey]: '' }));
  }

  async function loadHalaqat() {
    try {
      setLoading(true);
      await migrateLegacy();
      // المصدر الموحّد: عقدة /programs مع القسم = halaqat (نفس صفحة البرامج)
      const response = await fetch(`${DB_URL}/programs.json?key=${API_KEY}`);
      if (!response.ok) throw new Error('Failed to fetch halaqat');
      const data = await response.json();
      const arr = data ? Object.entries(data)
        .map(([id, item]) => ({ id, ...item }))
        .filter((x) => x.section === 'halaqat') : [];
      setHalaqat(arr);
      setError('');
    } catch (err) {
      setError('فشل تحميل الحلقات');
      setHalaqat([]);
    } finally { setLoading(false); }
  }

  /* نقل الحلقات القديمة من /halaqat إلى /programs مرة واحدة حتى تُربط الصفحتان */
  async function migrateLegacy() {
    if (localStorage.getItem('mh_halaqat_migrated') === '1') return;
    try {
      const r = await fetch(`${DB_URL}/halaqat.json?key=${API_KEY}`);
      if (!r.ok) return;
      const data = await r.json();
      const entries = data ? Object.entries(data) : [];
      for (const [, item] of entries) {
        const payload = {
          section: 'halaqat',
          name: item.name || '',
          studentType: item.studentType || '',
          count: (item.count != null && item.count !== '') ? item.count : (item.studentsCount != null ? item.studentsCount : ''),
          mosque: item.mosque || '',
          area: item.area || '',
          association: item.association || '',
          startDate: item.startDate || '',
          endDate: item.endDate || '',
          notes: item.notes || (item.instructor ? ('المعلّم: ' + item.instructor + (item.schedule ? ' — ' + item.schedule : '')) : ''),
          status: item.status || 'active',
        };
        const pr = await fetch(`${DB_URL}/programs.json?key=${API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!pr.ok) throw new Error('migrate post failed');
      }
      // بعد نقل الجميع بنجاح، أفرغ العقدة القديمة
      if (entries.length) await fetch(`${DB_URL}/halaqat.json?key=${API_KEY}`, { method: 'DELETE' });
      localStorage.setItem('mh_halaqat_migrated', '1');
    } catch (_) { /* نعيد المحاولة في التحميل القادم */ }
  }

  function openAdd() { setForm(emptyHalaqa()); setEditingId(null); setError(''); setOpenModal(true); }

  function handleEdit(item) {
    setForm({ ...emptyHalaqa(), ...item });
    setEditingId(item.id);
    setError(''); setOpenModal(true);
  }

  async function handleSave() {
    const missing = HALAQA_FIELDS.filter((f) => f.required && !String(form[f.key] || '').trim());
    if (missing.length) { setError('يرجى تعبئة الحقول المطلوبة: ' + missing.map((m) => m.label).join('، ')); return; }
    try {
      setLoading(true);
      const payload = { ...form, section: 'halaqat' };
      if (payload.count !== '' && payload.count != null) payload.count = parseInt(payload.count) || 0;
      // اعتماد: الموظف يقدّم الطلب «تحت التدقيق»، والمدير يعتمده مباشرة
      payload.approval = isManager ? 'approved' : 'pending';
      // تسجيل الموظف صاحب الإدخال لتقرير «إنجاز الموظفين»
      if (!editingId) { const u = window.MH_USER; if (u) { payload.createdBy = u.username; payload.createdByName = u.name; } }
      if (editingId) {
        const r = await fetch(`${DB_URL}/programs/${editingId}.json?key=${API_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error('Update failed');
      } else {
        const r = await fetch(`${DB_URL}/programs.json?key=${API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        if (!r.ok) throw new Error('Create failed');
      }
      await loadHalaqat();
      window.dispatchEvent(new Event('mh-data-changed'));
      setOpenModal(false); setEditingId(null); setError('');
    } catch (err) { setError('فشل الحفظ. تحقق من الإنترنت.'); } finally { setLoading(false); }
  }

  async function handleApprove(item) {
    try {
      setLoading(true);
      const r = await fetch(`${DB_URL}/programs/${item.id}.json?key=${API_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ approval: 'approved' }) });
      if (!r.ok) throw new Error('Approve failed');
      await loadHalaqat();
      window.dispatchEvent(new Event('mh-data-changed'));
    } catch (err) { setError('فشل الاعتماد'); } finally { setLoading(false); }
  }

  async function handleDelete(id) {
    if (!confirm('تأكيد حذف هذه الحلقة؟')) return;
    try {
      setLoading(true);
      const r = await fetch(`${DB_URL}/programs/${id}.json?key=${API_KEY}`, { method: 'DELETE' });
      if (!r.ok) throw new Error('Delete failed');
      await loadHalaqat();
    } catch (err) { setError('فشل الحذف'); } finally { setLoading(false); }
  }

  const filtered = halaqat.filter((h) => {
    const matchesTab = filterTab === 'all' || (h.status || 'active') === filterTab;
    const hay = ((h.name || '') + ' ' + (h.mosque || '') + ' ' + (h.area || '') + ' ' + (h.instructor || '')).toLowerCase();
    const matchesPending = !pendingOnly || h.approval === 'pending';
    return matchesTab && matchesPending && hay.includes(searchQ.toLowerCase());
  });
  const pendingCount = halaqat.filter((h) => h.approval === 'pending').length;

  /* ----- كشف تكرار المسجد ----- */
  function normMosque(s) {
    return String(s || '').trim().replace(/\s+/g, ' ').replace(/[\u0623\u0625\u0622]/g, '\u0627').replace(/\u0629/g, '\u0647').toLowerCase();
  }
  const mosqueNames = React.useMemo(() => {
    const m = new Map();
    halaqat.forEach((p) => { const n = (p.mosque || '').trim(); if (n && !m.has(normMosque(n))) m.set(normMosque(n), n); });
    return [...m.values()].sort((a, b) => a.localeCompare(b, 'ar'));
  }, [halaqat]);
  function existingAtMosque(val) {
    const key = normMosque(val);
    if (!key) return [];
    return halaqat.filter((p) => normMosque(p.mosque) === key && p.id !== editingId);
  }

  /* عرض حقل واحد في النموذج */
  /* يُستدعى كدالة مباشرة (وليس كعنصر JSX) حتى لا يُعاد إنشاء الحقل عند كل
     ضغطة مفتاح، فيبقى مؤشّر الكتابة داخل الحقل ويمكن كتابة جملة كاملة. */
  function FieldInput(f) {
    const common = { width: '100%', height: 44, boxSizing: 'border-box', padding: '0 14px', fontFamily: 'var(--font-body)', fontSize: 'var(--text-md)', color: 'var(--text-strong)', background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', outline: 'none' };
    const label = (
      <label style={{ display: 'block', marginBottom: 6, fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-body)' }}>
        {f.label}{f.required && <span style={{ color: 'var(--red-600)', marginInlineStart: 4 }}>*</span>}
      </label>
    );
    let control;
    if (f.type === 'select' || f.type === 'select-manage') {
      const opts = f.type === 'select-manage' ? (lists[f.listKey] || []) : f.options;
      const selectEl = (
        <div style={{ position: 'relative', flex: 1 }}>
          <select value={form[f.key] || ''} onChange={(e) => setForm({ ...form, [f.key]: e.target.value })} style={{ ...common, appearance: 'none', paddingInlineStart: 38, cursor: 'pointer' }}>
            <option value="">{f.ph || '— اختر —'}</option>
            {opts.map((o) => <option key={o} value={o}>{o}</option>)}
          </select>
          <span style={{ position: 'absolute', insetInlineStart: 12, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: 'var(--text-subtle)' }}>▾</span>
        </div>
      );
      control = f.type === 'select-manage' ? (
        <div style={{ display: 'flex', gap: 8 }}>
          {selectEl}
          <button type="button" onClick={() => addListItem(f.listKey, f.key, f.addPrompt)} title="إضافة جديدة" style={{ flexShrink: 0, height: 44, padding: '0 14px', display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--blue-700)', background: 'var(--blue-50)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', cursor: 'pointer' }}>
            <Icon n="plus" size={15} />جديدة
          </button>
          <button type="button" onClick={() => deleteListItem(f.listKey, f.key)} title="حذف المحدّد" aria-label="حذف المحدّد" style={{ flexShrink: 0, width: 44, height: 44, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: 'var(--red-600)', background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', cursor: 'pointer' }}>
            <Icon n="trash-2" size={16} />
          </button>
        </div>
      ) : selectEl;
    } else if (f.type === 'textarea') {
      control = (
        <textarea value={form[f.key] || ''} placeholder={f.ph || ''}
          onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}
          style={{ ...common, height: 92, padding: '11px 14px', lineHeight: 1.7, resize: 'vertical', direction: 'rtl', textAlign: 'right' }} />
      );
    } else {
      control = (
        <input type={f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : f.type === 'tel' ? 'tel' : 'text'}
          value={form[f.key] || ''} placeholder={f.ph || ''}
          list={f.key === 'mosque' ? 'mh-known-mosques-h' : undefined}
          onChange={(e) => setForm({ ...form, [f.key]: e.target.value })}
          style={{ ...common, direction: 'rtl', textAlign: 'right' }} />
      );
    }
    if (f.key === 'mosque') {
      const dup = existingAtMosque(form.mosque);
      const nm = (form.mosque || '').trim();
      return (
        <div>
          {label}{control}
          <datalist id="mh-known-mosques-h">
            {mosqueNames.map((n) => <option key={n} value={n}></option>)}
          </datalist>
          {dup.length > 0 && (
            <div style={{ marginTop: 10, display: 'flex', gap: 10, padding: '11px 14px', background: 'var(--status-warning-bg)', border: '1px solid var(--amber-300)', borderRadius: 'var(--radius-md)' }}>
              <span style={{ color: 'var(--status-warning-fg)', flexShrink: 0, marginTop: 1, display: 'inline-flex' }}><Icon n="alert-triangle" size={18} /></span>
              <div style={{ fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', lineHeight: 1.7, color: 'var(--text-body)' }}>
                <div style={{ fontWeight: 800, color: 'var(--status-warning-fg)', marginBottom: 2 }}>هذا المسجد به حلقة مُسجّلة بالفعل</div>
                <div>مسجد «{nm}» مُسجّل عليه {dup.length} {dup.length === 1 ? 'حلقة' : 'حلقات'} حالياً، يمكنك المتابعة إن أردت إضافة حلقة أخرى:</div>
                <ul style={{ margin: '6px 0 0', paddingInlineStart: 18, display: 'flex', flexDirection: 'column', gap: 3 }}>
                  {dup.map((d) => { const st = halaqaStatusView(d); return (
                    <li key={d.id} style={{ color: 'var(--text-body)' }}>
                      <strong style={{ color: 'var(--text-strong)' }}>{d.name || '—'}</strong>
                      <span style={{ color: 'var(--text-subtle)' }}> — {d.area || 'حلقة'} · {st.label}</span>
                    </li>
                  ); })}
                </ul>
              </div>
            </div>
          )}
        </div>
      );
    }
    return <div>{label}{control}</div>;
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div>
          <h1 style={{ margin: 0, fontFamily: 'var(--font-display)', fontSize: 'var(--text-3xl)', fontWeight: 800, color: 'var(--text-strong)' }}>نظام الحلقات</h1>
          <p style={{ margin: '4px 0 0 0', color: 'var(--text-muted)' }}>إدارة حلقات التحفيظ — المسجد، المنطقة، التصريح والحالة.</p>
        </div>
        <Button onClick={openAdd} disabled={loading} iconStart={<Icon n="plus" size={16} />}>إضافة حلقة</Button>
      </div>

      {error && !openModal && (
        <div style={{ background: '#fdecea', color: '#c0392b', padding: 12, borderRadius: 10, fontSize: 14 }}>{error}</div>
      )}

      <div style={{ background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-sm)', overflow: 'hidden' }}>
        <div style={{ padding: 16, borderBottom: '1px solid var(--border-subtle)', display: 'flex', gap: 12, alignItems: 'center', flexWrap: 'wrap' }}>
          <div style={{ flex: 1, minWidth: 220 }}>
            <Input placeholder="ابحث بالاسم أو المسجد أو المنطقة…" value={searchQ} onChange={(e) => setSearchQ(e.target.value)} icon={<Icon n="search" size={16} />} />
          </div>
          <div style={{ display: 'flex', gap: 6 }}>
            {[['all', 'الكل'], ['active', 'فعّالة'], ['inactive', 'متوقفة']].map(([id, lbl]) => {
              const active = filterTab === id;
              return (
                <button key={id} onClick={() => setFilterTab(id)} style={{ padding: '8px 14px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, border: `1px solid ${active ? 'var(--brand)' : 'var(--border-default)'}`, background: active ? 'var(--blue-50)' : 'var(--surface-card)', color: active ? 'var(--blue-700)' : 'var(--text-muted)' }}>{lbl}</button>
              );
            })}
          </div>
          {isManager && pendingCount > 0 && (
            <button type="button" onClick={() => setPendingOnly((v) => !v)} style={{ display: 'inline-flex', alignItems: 'center', gap: 7, padding: '8px 14px', borderRadius: 'var(--radius-pill)', cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 700, border: `1px solid ${pendingOnly ? 'var(--amber-300)' : 'var(--border-default)'}`, background: pendingOnly ? 'var(--status-warning-bg)' : 'var(--surface-card)', color: pendingOnly ? 'var(--status-warning-fg)' : 'var(--text-muted)' }}>
              <Icon n="clock" size={15} />تحت التدقيق
              <span style={{ fontSize: 'var(--text-xs)', fontWeight: 800, background: 'var(--status-warning-fg)', color: '#fff', borderRadius: 'var(--radius-pill)', padding: '1px 7px' }}>{pendingCount}</span>
            </button>
          )}
        </div>

        {loading ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>جاري التحميل…</div>
        ) : filtered.length === 0 ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>لا توجد حلقات</div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14, fontFamily: 'var(--font-body)' }}>
              <thead>
                <tr style={{ background: 'var(--surface-sunken)' }}>
                  {['اسم الجهة', 'نوع الطلاب', 'الطلاب', 'المسجد', 'المنطقة', 'الحالة', ''].map((h, i) => (
                    <th key={i} style={{ padding: '12px 16px', textAlign: 'start', fontWeight: 700, color: 'var(--text-subtle)', fontSize: 'var(--text-xs)', whiteSpace: 'nowrap' }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((item) => {
                  const st = halaqaStatusView(item);
                  const count = (item.count != null && item.count !== '') ? item.count : (item.studentsCount != null ? item.studentsCount : '—');
                  return (
                    <tr key={item.id} style={{ borderTop: '1px solid var(--border-subtle)' }}>
                      <td style={{ padding: '12px 16px', fontWeight: 700, color: 'var(--text-strong)' }}>{item.name || '—'}</td>
                      <td style={{ padding: '12px 16px', color: 'var(--text-body)' }}>{item.studentType || '—'}</td>
                      <td style={{ padding: '12px 16px', fontVariantNumeric: 'tabular-nums' }}>{count}</td>
                      <td style={{ padding: '12px 16px', color: 'var(--text-muted)' }}>{item.mosque || '—'}</td>
                      <td style={{ padding: '12px 16px', color: 'var(--text-muted)' }}>{item.area || '—'}</td>
                      <td style={{ padding: '12px 16px' }}>{item.approval === 'pending' ? <Badge color="yellow" dot>تحت التدقيق</Badge> : <Badge color={st.color} dot>{st.label}</Badge>}</td>
                      <td style={{ padding: '12px 16px', textAlign: 'left' }}>
                        <div style={{ display: 'flex', gap: 4 }}>
                          {isManager && item.approval === 'pending' && <IconButton label="اعتماد" onClick={() => handleApprove(item)} style={{ color: 'var(--green-600)' }}><Icon n="badge-check" size={16} /></IconButton>}
                          <IconButton label="تعديل" onClick={() => handleEdit(item)} style={{ color: 'var(--blue-600)' }}><Icon n="pencil" size={16} /></IconButton>
                          {isManager && <IconButton label="حذف" onClick={() => handleDelete(item.id)} style={{ color: 'var(--red-600)' }}><Icon n="trash-2" size={16} /></IconButton>}
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {openModal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 16 }}>
          <div style={{ width: 640, maxWidth: '100%', maxHeight: '92vh', display: 'flex', flexDirection: 'column', background: 'var(--surface-card)', border: '1px solid var(--border-subtle)', borderRadius: 'var(--radius-lg)', boxShadow: 'var(--shadow-lg)', overflow: 'hidden' }}>
            <div style={{ padding: '18px 22px', borderBottom: '1px solid var(--border-subtle)', flexShrink: 0 }}>
              <h2 style={{ margin: 0, fontSize: 20, fontFamily: 'var(--font-display)', fontWeight: 800, color: 'var(--text-strong)' }}>{editingId ? 'تعديل الحلقة' : 'إضافة حلقة جديدة'}</h2>
            </div>

            <div style={{ padding: 22, overflowY: 'auto', flex: 1, minHeight: 0 }}>
              {error && <div style={{ background: '#fdecea', color: '#c0392b', padding: 12, borderRadius: 10, fontSize: 14, marginBottom: 16 }}>{error}</div>}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                {HALAQA_FIELDS.map((f) => (
                  <div key={f.key} style={{ gridColumn: f.full ? '1 / -1' : 'auto' }}>
                    {FieldInput(f)}
                  </div>
                ))}
              </div>

              <div style={{ marginTop: 18, display: 'flex', alignItems: 'center', gap: 10 }}>
                <label style={{ fontSize: 'var(--text-sm)', fontWeight: 700, color: 'var(--text-body)' }}>الحالة:</label>
                {window.Switch && (
                  <window.Switch checked={form.status === 'active'} onChange={(v) => setForm({ ...form, status: v ? 'active' : 'inactive' })} label={form.status === 'active' ? 'فعّالة' : 'متوقفة'} />
                )}
              </div>
            </div>

            <div style={{ padding: '16px 22px', borderTop: '1px solid var(--border-subtle)', display: 'flex', gap: 10, flexShrink: 0 }}>
              <Button onClick={handleSave} disabled={loading} style={{ flex: 1 }} iconStart={<Icon n="check" size={16} />}>حفظ الحلقة</Button>

<script type="text/babel" data-presets="react">

function lessonStatusView(item) {
  if (item.status && item.status !== 'active') return { label: 'معطّل', color: 'gray' };
  const end = item.endDate ? new Date(item.endDate + 'T00:00:00') : null;
  if (end && !isNaN(end)) {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const days = Math.round((end - today) / 86400000);
    if (days < 0) return { label: 'منتهٍ', color: 'red' };
    if (days <= 14) return { label: 'قارب على الانتهاء', color: 'yellow' };
  }
  return { label: 'فعّال', color: 'green' };
}

function LessonsWomenScreen({ role }) {
  const { Card, Badge, Button, IconButton, Input, Icon, Switch } = window;
  const isManager = role === 'section_manager';
  
  const [lessons, setLessons] = React.useState([]);
  const [filterTab, setFilterTab] = React.useState('all');
  const [searchQ, setSearchQ] = React.useState('');

  const [editingId, setEditingId] = React.useState(null);
  const [loading, setLoading] = React.useState(true);

    attendees: 0,

  });

    try {
      setLoading(true);
      const response = await fetch(`${DB_URL}/lessons/women.json?key=${API_KEY}`);
      
      if (!response.ok) throw new Error('Failed to fetch lessons');

      const data = await response.json();
      const lessonsArray = data ? Object.entries(data).map(([id, item]) => ({
        id,
        ...item
      })) : [];
      
      setLessons(lessonsArray);
      setError('');
    } catch (err) {
      console.error('Error loading lessons:', err);
      setError('فشل تحميل الدروس');
      setLessons([]);
    } finally {
      setLoading(false);

          {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(form)
          }

          `${DB_URL}/lessons/women.json?key=${API_KEY}`,
          {

            headers: { 'Content-Type': 'application/json' },

<script type="text/babel" data-presets="react">

    availability: '',

  });

  React.useEffect(() => {
    loadImams();
  }, []);

  async function loadImams() {

<script type="text/babel" data-presets="react">
/* ===== SettingsScreen.jsx ===== */
/* شاشة الإعدادات والمزامنة — يضبط المدير رابط Firebase لمزامنة الأجهزة. */
function SettingsScreen({ role }) {
  const { Card, Button, Badge, Icon } = window;
  const isManager = role === 'section_manager';

  const current = (window.getSyncUrl && window.getSyncUrl()) || '';
  const [url, setUrl] = React.useState(current);
  const [testing, setTesting] = React.useState(false);
  const [msg, setMsg] = React.useState(null); // {type, text}
  const synced = !!current;

  function normalize(v) { return (v || '').trim().replace(/\/$/, ''); }

  async function testConn() {
    const v = normalize(url);
    if (!v) { setMsg({ type: 'err', text: 'الرجاء لصق رابط قاعدة البيانات أولاً.' }); return; }
    if (!/^https:\/\/.+/.test(v)) { setMsg({ type: 'err', text: 'الرابط يجب أن يبدأ بـ https://' }); return; }
    setTesting(true); setMsg(null);
    try {
      const r = await fetch(v + '/.json');
      if (!r.ok) throw new Error('bad');
      await r.json();
      setMsg({ type: 'ok', text: 'تم الاتصال بنجاح ✓ — يمكنك الآن حفظ التفعيل.' });
    } catch (e) {
      setMsg({ type: 'err', text: 'تعذّر الاتصال. تأكد من الرابط ومن أن قواعد القراءة/الكتابة مفتوحة.' });
    } finally { setTesting(false); }
  }

  function saveSync() {
    const v = normalize(url);
    if (!/^https:\/\/.+/.test(v)) { setMsg({ type: 'err', text: 'الرابط يجب أن يبدأ بـ https://' }); return; }
    try { localStorage.setItem(window.SYNC_URL_KEY, v); } catch (_) {}
    setMsg({ type: 'ok', text: 'تم تفعيل المزامنة. سيُعاد تحميل البرنامج…' });
    setTimeout(() => location.reload(), 900);
  }

  function disableSync() {
    try { localStorage.removeItem(window.SYNC_URL_KEY); } catch (_) {}
    setMsg({ type: 'ok', text: 'تم إيقاف المزامنة (وضع محلي). سيُعاد التحميل…' });
    setTimeout(() => location.reload(), 900);
  }

  const labelStyle = { display: 'block', marginBottom: 8, fontSize: 14, fontWeight: 700, color: 'var(--text-body)' };
  const stepNum = (n) => (
    <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 26, height: 26, borderRadius: '50%', background: 'var(--blue-50)', color: 'var(--blue-700)', fontWeight: 800, fontSize: 13, flexShrink: 0 }}>{n}</span>
  );

  if (!isManager) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', gap: 12, textAlign: 'center' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 64, height: 64, borderRadius: 'var(--radius-xl)', background: 'var(--blue-50)', color: 'var(--blue-500)' }}><Icon n="lock" size={28} /></span>
        <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-2xl)', fontWeight: 800, color: 'var(--text-strong)' }}>الإعدادات والمزامنة</h2>
        <p style={{ color: 'var(--text-muted)', maxWidth: 360 }}>هذه الشاشة متاحة للمدير فقط.</p>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 20, maxWidth: 760 }}>
      <div>
        <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-3xl)', fontWeight: 800, color: 'var(--text-strong)' }}>الإعدادات والمزامنة</h1>
        <p style={{ color: 'var(--text-muted)', marginTop: 4 }}>فعّل المزامنة لمشاركة البيانات بين جميع الأجهزة (اللاب توب والآيباد).</p>
      </div>

      {/* الحالة */}
      <Card>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 46, height: 46, borderRadius: 'var(--radius-md)', background: synced ? 'var(--green-50)' : 'var(--surface-sunken)', color: synced ? 'var(--green-600)' : 'var(--text-subtle)' }}>
              <Icon n={synced ? 'cloud' : 'hard-drive'} size={24} />
            </span>
            <div>
              <div style={{ fontWeight: 800, color: 'var(--text-strong)', fontSize: 'var(--text-lg)' }}>{synced ? 'المزامنة مفعّلة' : 'وضع محلي'}</div>
              <div style={{ color: 'var(--text-muted)', fontSize: 'var(--text-sm)' }}>{synced ? 'البيانات مشتركة بين كل الأجهزة المتصلة بنفس الرابط.' : 'البيانات محفوظة على هذا الجهاز فقط — يعمل بدون إنترنت.'}</div>
            </div>
          </div>
          <Badge color={synced ? 'green' : 'gray'} dot>{synced ? 'متصل' : 'محلي'}</Badge>
        </div>
      </Card>

      {/* الإعداد */}
      <Card title="رابط قاعدة بيانات Firebase">
        <label style={labelStyle}>الصق الرابط هنا (يبدأ بـ https وينتهي بـ firebasedatabase.app أو firebaseio.com)</label>
        <input value={url} onChange={(e) => setUrl(e.target.value)} placeholder="https://your-project-default-rtdb.firebasedatabase.app"
          style={{ width: '100%', padding: '12px 14px', border: '1px solid var(--border-default)', borderRadius: 10, fontSize: 14, boxSizing: 'border-box', fontFamily: 'monospace', direction: 'ltr', textAlign: 'left' }} />

        {msg && (
          <div style={{ marginTop: 12, padding: '10px 14px', borderRadius: 10, fontSize: 14, background: msg.type === 'ok' ? 'var(--green-50)' : '#fdecea', color: msg.type === 'ok' ? 'var(--green-700)' : '#c0392b' }}>{msg.text}</div>
        )}

        <div style={{ display: 'flex', gap: 10, marginTop: 16, flexWrap: 'wrap' }}>
          <Button variant="secondary" onClick={testConn} disabled={testing} iconStart={<Icon n="plug" size={16} />}>{testing ? 'جاري الاختبار…' : 'اختبار الاتصال'}</Button>
          <Button onClick={saveSync} iconStart={<Icon n="check" size={16} />}>تفعيل المزامنة</Button>
          {synced && <Button variant="ghost" onClick={disableSync} style={{ color: 'var(--red-600)' }} iconStart={<Icon n="x" size={16} />}>إيقاف المزامنة</Button>}
        </div>
      </Card>

      {/* خطوات الإنشاء */}
      <Card title="كيف أحصل على الرابط؟ (مرة واحدة — مجاناً)">
        <ol style={{ listStyle: 'none', margin: 0, padding: 0, display: 'flex', flexDirection: 'column', gap: 16 }}>
          {[
            ['افتح console.firebase.google.com وسجّل الدخول بحساب Google، ثم أنشئ مشروعاً جديداً (Add project).'],
            ['من القائمة الجانبية اختر Build ← Realtime Database ثم Create Database، واختر الموقع وابدأ بوضع «Test mode».'],
            ['انسخ رابط قاعدة البيانات الظاهر في الأعلى (مثل https://اسم-المشروع-default-rtdb.firebasedatabase.app).'],
            ['الصق الرابط في الحقل أعلاه، اضغط «اختبار الاتصال» ثم «تفعيل المزامنة».'],
            ['كرّر اللصق نفسه على الآيباد وأي جهاز آخر — وستتشارك جميعها نفس البيانات.']
          ].map((s, i) => (
            <li key={i} style={{ display: 'flex', gap: 12, alignItems: 'flex-start' }}>
              {stepNum(i + 1)}
              <span style={{ color: 'var(--text-body)', fontSize: 'var(--text-md)', lineHeight: 1.7, paddingTop: 2 }}>{s[0]}</span>
            </li>
          ))}
        </ol>
        <div style={{ marginTop: 16, padding: '12px 14px', borderRadius: 10, background: 'var(--surface-sunken)', color: 'var(--text-muted)', fontSize: 13, lineHeight: 1.7 }}>
          ملاحظة أمنية: «Test mode» يجعل القراءة والكتابة مفتوحة لمدة شهر. للاستخدام الدائم اضبط قواعد الأمان لاحقاً، أو أبقها مفتوحة إن كانت البيانات غير حسّاسة. عند أول اتصال ناجح ستُعبّأ القاعدة ببيانات تجريبية تلقائياً إذا كانت فارغة.
        </div>
      </Card>
    </div>
  );
}
window.SettingsScreen = SettingsScreen;

</script>

<script type="text/babel" data-presets="react">
/* ===== UsersScreen.jsx ===== */
/* إدارة المستخدمين — إضافة/تعديل/حذف حسابات الموظفين (متزامنة مع كل الأجهزة). */
function UsersScreen({ role }) {
  const { Card, Badge, Button, IconButton, Input, Icon } = window;
  const isManager = role === 'section_manager';

  const [users, setUsers] = React.useState([]);
  const [searchQ, setSearchQ] = React.useState('');
  const [openModal, setOpenModal] = React.useState(false);
  const [editingId, setEditingId] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState('');

  const DB_URL = window.FIREBASE_DB_URL;
  const API_KEY = window.FIREBASE_API_KEY;
  const synced = window.isSyncEnabled && window.isSyncEnabled();

  const [form, setForm] = React.useState({ name: '', username: '', password: '', role: 'employee' });

  React.useEffect(() => { loadUsers(); }, []);

  async function loadUsers() {
    try {
      setLoading(true);
      const r = await fetch(`${DB_URL}/users.json?key=${API_KEY}`);
      if (!r.ok) throw new Error('fail');
      const data = await r.json();
      const arr = data ? Object.entries(data).map(([id, item]) => ({ id, ...item })) : [];
      setUsers(arr);
      setError('');
    } catch (e) {
      setError('تعذّر تحميل المستخدمين');
      setUsers([]);
    } finally { setLoading(false); }
  }

  function resetForm() { setForm({ name: '', username: '', password: '', role: 'employee' }); setEditingId(null); }

  async function handleSave() {
    if (!form.name.trim() || !form.username.trim() || !form.password.trim()) {
      setError('الاسم واسم المستخدم وكلمة المرور مطلوبة'); return;
    }
    // منع تكرار اسم المستخدم
    const dup = users.find((u) => u.username.toLowerCase() === form.username.trim().toLowerCase() && u.id !== editingId);
    if (dup) { setError('اسم المستخدم مستخدم مسبقاً، اختر اسماً آخر'); return; }
    try {
      setLoading(true);
      const body = { name: form.name.trim(), username: form.username.trim(), password: form.password.trim(), role: form.role };
      if (editingId) {
        const r = await fetch(`${DB_URL}/users/${editingId}.json?key=${API_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!r.ok) throw new Error('update');
      } else {
        const r = await fetch(`${DB_URL}/users.json?key=${API_KEY}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (!r.ok) throw new Error('create');
      }
      await loadUsers();
      setOpenModal(false); resetForm(); setError('');
    } catch (e) { setError('فشل الحفظ'); } finally { setLoading(false); }
  }

  async function handleToggleActive(item) {
    const turningOff = !item.disabled;
    if (!confirm(turningOff ? 'إيقاف هذا المستخدم؟ لن يتمكّن من تسجيل الدخول حتّى تعيد تفعيله.' : 'إعادة تفعيل هذا المستخدم؟')) return;
    try {
      setLoading(true);
      const r = await fetch(`${DB_URL}/users/${item.id}.json?key=${API_KEY}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ disabled: turningOff }) });
      if (!r.ok) throw new Error('toggle');
      await loadUsers();
    } catch (e) { setError('تعذّر تغيير حالة المستخدم'); } finally { setLoading(false); }
  }

  async function handleDelete(id) {
    if (!confirm('تأكيد حذف هذا المستخدم؟')) return;
    try {
      setLoading(true);
      const r = await fetch(`${DB_URL}/users/${id}.json?key=${API_KEY}`, { method: 'DELETE' });
      if (!r.ok) throw new Error('delete');
      await loadUsers();
    } catch (e) { setError('فشل الحذف'); } finally { setLoading(false); }
  }

  function handleEdit(item) { setForm({ name: item.name || '', username: item.username || '', password: item.password || '', role: item.role || 'employee' }); setEditingId(item.id); setOpenModal(true); }

  const filtered = users.filter((u) => (u.name || '').toLowerCase().includes(searchQ.toLowerCase()) || (u.username || '').toLowerCase().includes(searchQ.toLowerCase()));

  const labelStyle = { display: 'block', marginBottom: 8, fontSize: 14, color: 'var(--text-secondary)' };
  const fieldStyle = { width: '100%', padding: '12px 14px', border: '1px solid var(--border-default)', borderRadius: 10, fontSize: 14, boxSizing: 'border-box', fontFamily: 'var(--font-body)' };

  if (!isManager) {
    return (
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', gap: 12, textAlign: 'center' }}>
        <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 64, height: 64, borderRadius: 'var(--radius-xl)', background: 'var(--blue-50)', color: 'var(--blue-500)' }}><Icon n="lock" size={28} /></span>
        <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-2xl)', fontWeight: 800, color: 'var(--text-strong)' }}>إدارة المستخدمين</h2>
        <p style={{ color: 'var(--text-muted)', maxWidth: 360 }}>هذه الشاشة متاحة للمدير فقط.</p>
      </div>
    );
  }

  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 16, maxWidth: 980 }}>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', gap: 12, flexWrap: 'wrap' }}>
        <div>
          <h1 style={{ fontFamily: 'var(--font-display)', fontSize: 'var(--text-3xl)', fontWeight: 800, color: 'var(--text-strong)' }}>إدارة المستخدمين</h1>
          <p style={{ color: 'var(--text-muted)', marginTop: 4 }}>أضِف لكل موظف اسم مستخدم وكلمة مرور وصلاحية.</p>
        </div>
        <Button onClick={() => { resetForm(); setError(''); setOpenModal(true); }} disabled={loading} iconStart={<Icon n="user-plus" size={16} />}>إضافة مستخدم</Button>
      </div>

      {!synced && (
        <div style={{ padding: '12px 14px', borderRadius: 10, background: 'var(--status-warning-bg)', color: 'var(--status-warning-fg)', fontSize: 14, lineHeight: 1.7 }}>
          تنبيه: المزامنة غير مفعّلة — المستخدمون الذين تضيفهم هنا سيُحفظون على هذا الجهاز فقط. لمشاركتهم بين كل الأجهزة فعّل المزامنة من «الإعدادات والمزامنة».
        </div>
      )}
      {error && <div style={{ background: '#fdecea', color: '#c0392b', padding: 12, borderRadius: 10, fontSize: 14 }}>{error}</div>}

      <Card padding={false}>
        <div style={{ padding: 16, borderBottom: '1px solid var(--border-subtle)' }}>
          <Input placeholder="ابحث بالاسم أو اسم المستخدم…" value={searchQ} onChange={(e) => setSearchQ(e.target.value)} icon={<Icon n="search" size={16} />} />
        </div>
        {loading ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>جاري التحميل…</div>
        ) : filtered.length === 0 ? (
          <div style={{ textAlign: 'center', padding: 40, color: 'var(--text-muted)' }}>لا يوجد مستخدمون</div>
        ) : (
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: 14, fontFamily: 'var(--font-body)' }}>
              <thead>
                <tr style={{ background: 'var(--surface-sunken)' }}>
                  {['الاسم', 'اسم المستخدم', 'كلمة المرور', 'الصلاحية', 'الحالة', ''].map((h, i) => (
                    <th key={i} style={{ padding: '12px 16px', textAlign: i === 5 ? 'left' : 'start', fontWeight: 700, color: 'var(--text-subtle)', fontSize: 'var(--text-xs)', whiteSpace: 'nowrap', ...(i === 5 ? { position: 'sticky', left: 0, background: 'var(--surface-sunken)', zIndex: 2 } : {}) }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((item) => (
                  <tr key={item.id} style={{ borderTop: '1px solid var(--border-subtle)', opacity: item.disabled ? 0.55 : 1 }}>
                    <td style={{ padding: '12px 16px', fontWeight: 700, color: 'var(--text-strong)' }}>{item.name}</td>
                    <td style={{ padding: '12px 16px', fontFamily: 'monospace', direction: 'ltr', textAlign: 'right' }}>{item.username}</td>
                    <td style={{ padding: '12px 16px', fontFamily: 'monospace', direction: 'ltr', textAlign: 'right', color: 'var(--text-muted)' }}>{item.password}</td>
                    <td style={{ padding: '12px 16px' }}><Badge color={item.role === 'section_manager' ? 'blue' : 'gray'}>{item.role === 'section_manager' ? 'رئيس القسم' : 'موظف'}</Badge></td>
                    <td style={{ padding: '12px 16px' }}><Badge color={item.disabled ? 'red' : 'green'} dot>{item.disabled ? 'موقوف' : 'نشط'}</Badge></td>
                    <td style={{ padding: '12px 16px', textAlign: 'left', position: 'sticky', left: 0, background: 'var(--surface-card)', boxShadow: '6px 0 8px -6px rgba(78,41,19,0.18)', zIndex: 1 }}>
                      <div style={{ display: 'flex', gap: 4, justifyContent: 'flex-start' }}>
                        <IconButton label="تعديل" onClick={() => handleEdit(item)} style={{ color: 'var(--blue-600)' }}><Icon n="pencil" size={16} /></IconButton>
                        <IconButton label={item.disabled ? 'تفعيل' : 'إيقاف'} onClick={() => handleToggleActive(item)} style={{ color: item.disabled ? 'var(--green-600)' : 'var(--status-warning-fg)' }}><Icon n={item.disabled ? 'circle-check' : 'ban'} size={16} /></IconButton>
                        <IconButton label="حذف" onClick={() => handleDelete(item.id)} style={{ color: 'var(--red-600)' }}><Icon n="trash-2" size={16} /></IconButton>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </Card>

      {openModal && (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000, padding: 16 }}>
          <Card style={{ width: 460, maxWidth: '100%' }}>
            <h2 style={{ margin: '0 0 16px 0', fontSize: 20, fontFamily: 'var(--font-display)', fontWeight: 800 }}>{editingId ? 'تعديل مستخدم' : 'إضافة مستخدم'}</h2>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div>
                <label style={labelStyle}>الاسم الكامل</label>
                <input value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} placeholder="مثال: محمد العتيبي" style={fieldStyle} />
              </div>
              <div>
                <label style={labelStyle}>اسم المستخدم (للدخول)</label>
                <input value={form.username} onChange={(e) => setForm({ ...form, username: e.target.value })} placeholder="mohammed" style={{ ...fieldStyle, direction: 'ltr', textAlign: 'left', fontFamily: 'monospace' }} />
              </div>
              <div>
                <label style={labelStyle}>كلمة المرور</label>
                <input value={form.password} onChange={(e) => setForm({ ...form, password: e.target.value })} placeholder="كلمة مرور" style={{ ...fieldStyle, direction: 'ltr', textAlign: 'left', fontFamily: 'monospace' }} />
              </div>
              <div>
                <label style={labelStyle}>الصلاحية</label>
                <select value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} style={{ ...fieldStyle, background: 'white', cursor: 'pointer' }}>
                  <option value="employee">موظف — يدير برامجه فقط</option>
                  <option value="section_manager">رئيس القسم — صلاحية كاملة</option>
                </select>
              </div>
              <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
                <Button onClick={handleSave} disabled={loading} style={{ flex: 1 }}>{editingId ? 'حفظ التعديل' : 'إضافة'}</Button>
                <Button variant="secondary" onClick={() => { setOpenModal(false); resetForm(); setError(''); }} disabled={loading} style={{ flex: 1 }}>إلغاء</Button>
              </div>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}
window.UsersScreen = UsersScreen;

</script>

<script type="text/babel" data-presets="react">
/* ===== app.jsx ===== */
/* الجذر: دخول → الواجهة مع توجيه الشاشات. */
function App() {
  const { AppShell, DashboardScreen, ProgramsScreen, HalaqatScreen, LessonsWomenScreen, LessonsMenScreen, ImamsScreen, GuestsScreen, SettingsScreen, UsersScreen, StaffReportScreen, ProgramsReportScreen } = window;
  const [user, setUser] = React.useState(null);
  const [nav, setNav] = React.useState('dashboard');
  const [live, setLive] = React.useState({ counts: null, stats: null });

  const refreshLive = React.useCallback(() => {
    if (window.loadLiveData) window.loadLiveData().then(setLive).catch(() => {});
  }, []);

  React.useEffect(() => { window.MH_USER = user; }, [user]);
  React.useEffect(() => { if (user) refreshLive(); }, [user, nav, refreshLive]);
  React.useEffect(() => {
    const h = () => refreshLive();
    window.addEventListener('mh-data-changed', h);
    return () => window.removeEventListener('mh-data-changed', h);
  }, [refreshLive]);

  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });

  if (!user) return <LoginScreen onLogin={(u) => { setUser(u); setNav('dashboard'); }} />;
  const role = user.role;

  let screen;
  if (nav === 'dashboard') screen = <DashboardScreen role={role} onNav={setNav} liveStats={live.stats} />;
  else if (nav === 'halaqat') screen = <HalaqatScreen role={role} />;
  else if (nav === 'women-lessons') screen = <ProgramsScreen role={role} nav={nav} />;
  else if (nav === 'men-lessons') screen = <ProgramsScreen role={role} nav={nav} />;
  else if (nav === 'imams') screen = <ImamsScreen role={role} />;
  else if (nav === 'guests') screen = <ProgramsScreen role={role} nav={nav} />;
  else if (nav === 'settings') screen = <SettingsScreen role={role} />;
  else if (nav === 'users') screen = <UsersScreen role={role} />;
  else if (nav === 'staff-report') screen = <StaffReportScreen role={role} />;
  else if (nav === 'programs-report') screen = <ProgramsReportScreen role={role} />;
  else if (['all', 'communities', 'women-lessons', 'men-lessons', 'guests', 'competitions', 'preachers'].includes(nav)) screen = <ProgramsScreen role={role} nav={nav} />;
  else screen = <PlaceholderScreen nav={nav} />;

  return (
    <AppShell user={user} role={role} active={nav} onNav={setNav} onLogout={() => setUser(null)} counts={live.counts} pending={live.pending}>
      {screen}
    </AppShell>
  );
}

function PlaceholderScreen({ nav }) {
  const titles = { users: 'إدارة المستخدمين', reports: 'التقارير والإحصائيات', backup: 'نسخة احتياطية' };
  const icons = { users: 'users', reports: 'bar-chart-3', backup: 'download' };
  return (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: '60vh', gap: 14, textAlign: 'center' }}>
